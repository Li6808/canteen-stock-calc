<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="食堂出库">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#15171a">
<meta name="format-detection" content="telephone=no">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>食堂出库</title>
<style>
:root{
  --bg:#f5f6f7;--panel:#ffffff;--panel2:#f0f2f5;--line:#e5e8ec;--line2:#cfd5dd;
  --tx:#1a1c1f;--tx2:#5f6672;--tx3:#9aa2ad;
  --amber:#ba7517;--red:#c94f3d;--green:#4d8f4a;--blue:#2f6f8f;--purple:#7a4fd0;
  --amber-bg:#f6ecd8;--red-bg:#f9e6e2;--green-bg:#e7f0e4;--blue-bg:#e2ecf2;--purple-bg:#ece7f8;
  --orange:#d85a30;
  --r:10px;--r2:14px;
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
body{font-family:var(--font);background:var(--bg);color:var(--tx);font-size:15px;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
.wrap{max-width:760px;margin:0 auto;padding:0 12px 100px}

.top{position:sticky;top:0;z-index:50;background:var(--panel);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.top-in{display:flex;align-items:center;gap:10px;padding:10px 14px}
.brand{font-size:16px;font-weight:600;display:flex;align-items:baseline;gap:7px;min-width:0;flex:1 1 auto}
.brand b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .ver{font-size:10px;color:var(--tx3);font-weight:400;white-space:nowrap}
.top-btns{display:flex;gap:6px;flex:0 0 auto}
.icon-btn{font-size:13px;border:1px solid var(--line2);background:var(--panel);color:var(--tx);border-radius:8px;padding:6px 11px;cursor:pointer;white-space:nowrap}
.icon-btn:active{background:var(--panel2)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:14px;margin-bottom:14px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:2px 0 12px}
.sec-h .t{font-size:16px;font-weight:600}
.sec-h .s{font-size:12px;color:var(--tx3)}

.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head .ym{font-size:15px;font-weight:600}
.cal-nav{display:flex;gap:4px}
.cal-nav button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line2);background:var(--panel);color:var(--tx);font-size:16px;cursor:pointer}
.cal-nav button:active{background:var(--panel2)}
.cal-week{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center;margin-bottom:4px}
.cal-week span{font-size:11px;color:var(--tx3);padding:3px 0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-day{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:8px;font-size:13px;cursor:pointer;position:relative;border:1px solid transparent}
.cal-day.empty{cursor:default}
.cal-day.today{background:var(--blue-bg);color:var(--blue);font-weight:600}
.cal-day.sel{background:var(--tx);color:#fff;font-weight:600}
.cal-day.other{color:var(--tx3)}
.cal-day .done{position:absolute;bottom:4px;width:4px;height:4px;border-radius:50%;background:var(--green)}
.cal-day.sel .done{background:#fff}
.cal-legend{display:flex;gap:14px;margin-top:10px;font-size:11px;color:var(--tx2);flex-wrap:wrap}
.cal-legend span{display:inline-flex;align-items:center;gap:4px}
.cal-legend i{width:8px;height:8px;border-radius:3px;display:inline-block}

.sum-grid{display:grid;grid-template-columns:1fr;gap:0}
.sum-col .cat{font-size:12.5px;font-weight:600;margin:12px 0 6px;padding-left:7px;border-left:3px solid}
.sum-col .cat:first-child{margin-top:0}
.sum-col .cat.c-amber{border-color:var(--amber);color:var(--amber)}
.sum-col .cat.c-red{border-color:var(--red);color:var(--red)}
.sum-col .cat.c-green{border-color:var(--green);color:var(--green)}
.sum-col .cat.c-purple{border-color:var(--purple);color:var(--purple)}
.ing-row{display:flex;align-items:center;gap:8px;padding:5px 0 5px 10px;font-size:14px}
.ing-row .nm{font-weight:500;flex:1}
.ing-row .slots{display:flex;gap:4px;flex:0 0 auto}
.ing-row .slots .s{font-size:11px;color:var(--tx3)}
.ing-row .slots .s.mid{color:var(--orange);font-weight:600}
.obtn{font-size:11px;border:1px solid var(--blue);color:var(--blue);border-radius:6px;padding:3px 8px;white-space:nowrap;background:transparent;cursor:pointer;flex:0 0 auto}
.obtn.done{color:var(--green);border-color:var(--green);background:var(--green-bg);font-weight:600}

.slot-block{margin-bottom:14px}
.slot-block:last-child{margin-bottom:0}
.slot-tag{font-size:12px;color:var(--tx2);margin-bottom:8px}
.dish-row{display:flex;align-items:baseline;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}
.dish-row:last-child{border-bottom:0}
.dish-row .dn{font-weight:500;font-size:14px;flex:0 0 92px;cursor:pointer;word-break:break-all}
.dish-row .dn:active{color:var(--blue)}
.dish-row .ings{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:12px;padding:2px 8px;border-radius:6px;cursor:pointer}
.chip.c-amber{background:var(--amber-bg);color:var(--amber)}
.chip.c-red{background:var(--red-bg);color:var(--red)}
.chip.c-green{background:var(--green-bg);color:var(--green)}
.chip.c-purple{background:var(--purple-bg);color:var(--purple)}
.chip:active{opacity:.6}
.dish-row .add{font-size:11px;color:var(--tx3);cursor:pointer;padding:2px 6px;border:1px dashed var(--line2);border-radius:6px}

.card.lunch{border:2px solid var(--orange)}

.prog{display:flex;flex-direction:column;gap:6px;align-items:center}
.prog-bg{width:100%;height:8px;border-radius:4px;background:var(--panel2);overflow:hidden}
.prog-fill{height:100%;background:var(--green);border-radius:4px;transition:width .3s}
.prog-txt{font-size:12px;color:var(--tx2)}

.edit-mode .dish-row{border:1px dashed var(--line2);border-radius:9px;padding:7px 10px;margin-bottom:6px}
.edit-mode .dish-row:last-child{margin-bottom:0}
.edit-mode .del{font-size:11px;color:var(--red);border:1px solid var(--red);border-radius:6px;padding:2px 7px;cursor:pointer;flex:0 0 auto;white-space:nowrap}
.edit-mode .add-dish{display:flex;align-items:center;justify-content:center;gap:4px;border:1px dashed var(--blue);border-radius:9px;padding:9px;color:var(--blue);font-size:13px;cursor:pointer;margin-top:8px}
.icon-btn.editing{border-color:var(--orange);color:var(--orange);font-weight:600}

.divider{height:1px;background:var(--line);margin:14px 0}

.confirm-bar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--panel);border-top:1px solid var(--line);padding:10px 14px;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
.confirm-bar .btn{width:100%;padding:13px;border-radius:10px;border:0;font-size:15px;font-weight:600;cursor:pointer;color:#fff;background:var(--tx)}
.confirm-bar .btn.done{background:var(--green)}
.confirm-bar .btn:active{opacity:.85}

.mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:none;align-items:flex-end;justify-content:center}
.mask.on{display:flex}
.mbox{background:var(--panel);width:100%;max-width:600px;border-radius:16px 16px 0 0;max-height:88vh;display:flex;flex-direction:column}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.mhead h3{margin:0;font-size:15px;font-weight:600}
.mclose{width:30px;height:30px;border:0;background:var(--panel2);border-radius:50%;font-size:18px;cursor:pointer;color:var(--tx)}
.mbody{padding:16px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.mfoot{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.mfoot button{flex:1;padding:11px;border-radius:9px;font-size:14px;cursor:pointer}
.btn-p{background:var(--tx);color:#fff;border:0;font-weight:500}
.btn-s{background:var(--panel);color:var(--tx);border:1px solid var(--line2)}

.f-label{font-size:12px;color:var(--tx2);display:block;margin:12px 0 5px}
.f-label:first-child{margin-top:0}
input,select,textarea{width:100%;font:inherit;font-size:15px;color:var(--tx);background:var(--panel);border:1px solid var(--line2);border-radius:9px;padding:9px 11px}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--blue)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:12px;color:var(--tx3);line-height:1.6;margin-top:8px}

.cat-list{display:flex;flex-direction:column;gap:6px}
.cat-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:9px}
.cat-item .nm{flex:1;font-size:14px}
.cat-item select{width:auto;font-size:13px;padding:6px 8px}

.ver-entry{padding:10px 0;border-bottom:1px solid var(--line)}
.ver-entry:last-child{border-bottom:0}
.ver-entry .vh{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.ver-entry .vh b{font-size:13px}
.ver-entry .vh span{font-size:11px;color:var(--tx3)}
.ver-entry ul{margin:0;padding-left:17px}
.ver-entry li{font-size:12.5px;line-height:1.8;color:var(--tx2)}

#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;z-index:200;transition:opacity .3s;max-width:80%;opacity:0}

@media(max-width:420px){
  .dish-row .dn{flex:0 0 82px}
  .sum-grid{gap:4px 12px}
}
</style>
</head>
<body>
<div class="top">
  <div class="top-in">
    <div class="brand"><b>食堂出库</b><span class="ver" id="verBadge"></span></div>
    <div class="top-btns">
      <button class="icon-btn" id="btnImport" onclick="doImport()">导入菜谱</button>
      <button class="icon-btn" id="btnEdit" onclick="toggleEditMode()">改菜谱</button>
      <button class="icon-btn" onclick="openSet()">设置</button>
    </div>
  </div>
</div>

<div class="wrap" id="wrap"></div>

<div class="confirm-bar" id="confirmBar" style="display:none"></div>

<div class="mask" id="mask" onclick="if(event.target===this)closeM()">
  <div class="mbox">
    <div class="mhead"><h3 id="mTitle"></h3><button class="mclose" onclick="closeM()">×</button></div>
    <div class="mbody" id="mBody"></div>
    <div class="mfoot" id="mFoot" style="display:none"></div>
  </div>
</div>

<input type="file" id="fileInput" accept=".xlsx,.xls,.csv" style="display:none" onchange="onFile(event)">

<script src="xlsx.full.min.js"></script>

   晚:[D('米饭',['大米']),D('蒜苔肉丝',['蒜苔','瘦肉']),D('粉蒸肉',['土豆','三线肉']),D('炒土豆',['土豆']),D('炒莲白粉条',['莲白','粉条']),D('玉米南瓜汤',['玉米','南瓜'])]},
7:{早:[D('稀饭',['大米']),D('鸡蛋面',['面条','油麦菜','瘦肉'])],
   午:[D('米饭',['大米']),D('木耳肉丝',['木耳','瘦肉']),D('西红柿炒鸡蛋',['西红柿','鸡蛋']),D('烧白',['三线肉','水盐菜']),D('红烧茄子',['茄子']),D('水白菜粉条',['水白菜','粉条'])],
   晚:[D('米饭',['大米']),D('回锅肉',['三线肉']),D('粉蒸排骨',['土豆','排骨']),D('炒土豆',['土豆']),D('炒油麦菜',['油麦菜']),D('平菇汤',['平菇'])]}
};
const DAYS=['周一','周二','周三','周四','周五','周六','周日'];
const SLOTS=['早','午','晚'];
const SLOT_NAMES={早:'早餐',午:'午餐',晚:'晚餐'};

const LSKEY='canteen_menu_v2';
let S=load()||fresh();
let cur=new Date();
function fresh(){return {menu:JSON.parse(JSON.stringify(DEFAULT_MENU)),cat:{},out:{},outDetail:{}};}
function load(){
  try{
    const d=JSON.parse(localStorage.getItem(LSKEY));
    if(!d||!d.menu)return null;
    if(!d.cat)d.cat={};
    if(!d.out)d.out={};
    if(!d.outDetail)d.outDetail={};
    return d;
  }catch(e){return null;}
}
function save(){localStorage.setItem(LSKEY,JSON.stringify(S));}

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const dowOf=d=>{let w=d.getDay();return w===0?7:w;};

function slotsOf(dow,ing){
  const s=[];
  SLOTS.forEach(sl=>{
    if(S.menu[dow][sl].some(x=>x.i.includes(ing)))s.push(sl==='早'?'早':sl==='午'?'中':'晚');
  });
  return s;
}

function render(){
  const dow=dowOf(cur);
  const wrap=$('wrap');
  const selIso=iso(cur);
  let h='';

  h+=`<div class="card">
    <div class="cal-head">
      <span class="ym">${cur.getFullYear()}年${cur.getMonth()+1}月</span>
      <div class="cal-nav">
        <button onclick="shiftMonth(-1)">‹</button>
        <button onclick="shiftMonth(1)">›</button>
      </div>
    </div>
    <div class="cal-week"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
    <div class="cal-grid">${calGrid()}</div>
    <div class="cal-legend">
      <span><i style="background:var(--blue)"></i>今天</span>
      <span><i style="background:var(--tx)"></i>选中</span>
      <span><i style="background:var(--green)"></i>已出库</span>
    </div>
  </div>`;

  h+=`<div class="card">
    <div class="sec-h"><span class="t">${DAYS[dow-1]} · 食材汇总</span><span class="s">后跟出库单</span></div>
    <div class="sum-grid">${sumGrid(dow)}</div>
  </div>`;

  h+=`<div class="card${window._editing?' edit-mode':''}">
    <div class="sec-h"><span class="t">${DAYS[dow-1]} · 全天菜谱</span><span class="s">${window._editing?'编辑模式：可加删改':'点菜名/食材可改'}</span></div>
    ${SLOTS.map(sl=>slotBlock(dow,sl)).join('<div class="divider"></div>')}
  </div>`;

  h+=`<div class="card lunch">
    <div class="sec-h"><span class="t" style="color:var(--orange)">营养午餐食材</span><span class="s">单独一份 · 后跟出库单</span></div>
    <div class="sum-grid">${sumGrid(dow,'午',true)}</div>
  </div>`;

  wrap.innerHTML=h;

  // 底部进度条
  const total=countDishes(dow);
  const filled=countFilled(dow);
  $('confirmBar').style.display='block';
  $('confirmBar').innerHTML=`
    <div class="prog">
      <div class="prog-bg"><div class="prog-fill" style="width:${total?Math.round(filled/total*100):0}%"></div></div>
      <div class="prog-txt">已填出库单 ${filled} / ${total}</div>
    </div>`;
}
/* 当天食材总数（去重） */
function allIngs(dow,slot){
  const set=new Set();
  const slots=slot?[slot]:['早','午','晚'];
  slots.forEach(sl=>S.menu[dow][sl].forEach(x=>x.i.forEach(i=>set.add(i))));
  if(!slot||slot==='午')set.add('菜油');
  return [...set];
}
function countDishes(dow){return allIngs(dow).length;}
function countFilled(dow){
  const di=iso(cur);
  return allIngs(dow).filter(ing=>S.outDetail[di+'|'+ing]).length;
}
function toggleOb(ing){
  const di=iso(cur);
  const k=di+'|'+ing;
  if(S.outDetail[k])delete S.outDetail[k];
  else{
    S.outDetail[k]=true;
    // 全部填完则标记当天已出库
    if(countFilled(dowOf(cur))===countDishes(dowOf(cur)))S.out[di]=true;
  }
  // 若有撤销则同步取消当天整体标记
  if(S.out[di]&&countFilled(dowOf(cur))<countDishes(dowOf(cur)))delete S.out[di];
  save();render();
}

function calGrid(){
  const y=cur.getFullYear(),m=cur.getMonth();
  const first=new Date(y,m,1);
  const startDow=first.getDay()===0?7:first.getDay();
  const daysInMonth=new Date(y,m+1,0).getDate();
  const today=new Date();
  const tIso=iso(today);
  const selIso=iso(cur);
  let cells='';
  for(let i=1;i<startDow;i++)cells+='<div class="cal-day empty"></div>';
  for(let d=1;d<=daysInMonth;d++){
    const dt=new Date(y,m,d);
    const di=iso(dt);
    let cls='cal-day';
    if(di===tIso)cls+=' today';
    if(di===selIso)cls+=' sel';
    if(!S.out[di]&&di!==selIso&&di!==tIso)cls+=' other';
    const done=S.out[di]?'<span class="done"></span>':'';
    cells+=`<div class="${cls}" onclick="pick('${di}')">${d}${done}</div>`;
  }
  return cells;
}

function sumGrid(dow,slot,onlyLunch){
  const group={};
  CATS.forEach(c=>group[c]=[]);
  const seen=new Set();
  const slots=slot?[slot]:['早','午','晚'];
  slots.forEach(sl=>{
    S.menu[dow][sl].forEach(x=>{
      x.i.forEach(ing=>{
        if(seen.has(ing))return;
        seen.add(ing);
        group[catOf(ing)].push(ing);
      });
    });
  });
  if(!slot||slot==='午'){
    if(!seen.has('菜油'))group[catOf('菜油')].push('菜油');
  }
  const sortInCat=(c,arr)=>{
    if(c==='米油面蛋'){
      return arr.sort((a,b)=>{
        const ia=ING_ORDER.indexOf(a),ib=ING_ORDER.indexOf(b);
        if(ia>=0&&ib>=0)return ia-ib;
        if(ia>=0)return -1;if(ib>=0)return 1;
        return a.localeCompare(b,'zh');
      });
    }
    return arr;
  };
  const di=iso(cur);
  // 一列：按 CATS 顺序往下排
  return CATS.map(c=>{
    const arr=sortInCat(c,group[c]);
    if(!arr.length)return '';
    const meta=CAT_META[c];
    const rows=arr.map(ing=>{
      const s=onlyLunch?[]:slotsOf(dow,ing);
      const slotsHtml=s.map(sl=>`<span class="s${sl==='中'?' mid':''}">${sl}</span>`).join('');
      const done=S.outDetail[di+'|'+ing];
      return `<div class="ing-row">
        <span class="nm">${esc(ing)}</span>
        ${s.length?`<span class="slots">${slotsHtml}</span>`:''}
        <button class="obtn${done?' done':''}" onclick="toggleOb('${esc(ing)}')">${done?'✓ 已填':'出库单'}</button>
      </div>`;
    }).join('');
    return `<div class="sum-col"><div class="cat ${meta.c}">${c}</div>${rows}</div>`;
  }).join('');
}

function slotBlock(dow,slot){
  const dishes=S.menu[dow][slot];
  const editing=window._editing;
  const rows=dishes.map((x,xi)=>{
    const chips=x.i.map(ing=>{
      const c=catOf(ing);
      return `<span class="chip ${CAT_META[c].c}" onclick="editIng(${dow},'${slot}',${xi},'${esc(ing)}')">${esc(ing)}</span>`;
    }).join('');
    return `<div class="dish-row">
      <span class="dn" onclick="editDish(${dow},'${slot}',${xi})">${esc(x.n)}</span>
      <span class="ings">${chips}${editing?`<span class="add" onclick="addIng(${dow},'${slot}',${xi})">+</span>`:''}</span>
      ${editing?`<span class="del" onclick="delDish(${dow},'${slot}',${xi})">删</span>`:''}
    </div>`;
  }).join('');
  const addBtn=editing?`<div class="add-dish" onclick="addDish(${dow},'${slot}')">＋ 加菜</div>`:'';
  return `<div class="slot-block">
    <div class="slot-tag">${SLOT_NAMES[slot]}</div>
    ${rows}${addBtn}
  </div>`;
}

function toggleEditMode(){
  window._editing=!window._editing;
  const btn=$('btnEdit');
  if(btn)btn.classList.toggle('editing',window._editing);
  render();
  if(window._editing)msg('编辑模式：可改菜名、改食材、加菜、删菜');
}
function delDish(dow,slot,xi){
  const x=S.menu[dow][slot][xi];
  if(!confirm('删除「'+x.n+'」这道菜？'))return;
  S.menu[dow][slot].splice(xi,1);
  save();render();
}
function addDish(dow,slot){
  openM('加菜 · '+SLOT_NAMES[slot],`
    <label class="f-label">菜名</label>
    <input id="eNewDish" placeholder="如：清炒豆芽">
    <label class="f-label">食材（顿号隔开）</label>
    <input id="eNewIngs" placeholder="如：豆芽、蒜">
  `,
  `<button class="btn-s" onclick="closeM()">取消</button><button class="btn-p" onclick="saveAddDish(${dow},'${slot}')">添加</button>`);
}
function saveAddDish(dow,slot){
  const n=$('eNewDish').value.trim();
  if(!n){alert('请输入菜名');return;}
  const ings=$('eNewIngs').value.trim().split(/[、,，\s]+/).filter(x=>x);
  S.menu[dow][slot].push({n:n,i:ings});
  save();render();closeM();
}

function shiftMonth(d){cur=new Date(cur.getFullYear(),cur.getMonth()+d,1);render();}
function pick(isoStr){
  const p=isoStr.split('-');
  cur=new Date(+p[0],+p[1]-1,+p[2]);
  render();
}

function editDish(dow,slot,xi){
  const x=S.menu[dow][slot][xi];
  openM('改菜名',`
    <label class="f-label">菜名</label>
    <input id="eDishName" value="${esc(x.n)}">
    <div class="hint">只改名字，食材不变。</div>`,
  `<button class="btn-s" onclick="closeM()">取消</button><button class="btn-p" onclick="saveDishName(${dow},'${slot}',${xi})">保存</button>`);
}
function saveDishName(dow,slot,xi){
  const v=$('eDishName').value.trim();
  if(!v){alert('菜名不能为空');return;}
  S.menu[dow][slot][xi].n=v;
  save();render();closeM();
}
function editIng(dow,slot,xi,ing){
  openM('改食材',`
    <div class="f-label">菜名：${esc(S.menu[dow][slot][xi].n)}</div>
    <label class="f-label">食材</label>
    <input id="eIngName" value="${esc(ing)}">
    <div class="hint">改名后，汇总里的分类会按新名字自动归。也可在「设置 → 食材分类」里手动指定。</div>`,
  `<button class="btn-s" onclick="closeM()">取消</button>
   <button class="btn-p" onclick="saveIngName(${dow},'${slot}',${xi},'${esc(ing)}')">保存</button>
   <button class="btn-s" style="color:var(--red)" onclick="delIng(${dow},'${slot}',${xi},'${esc(ing)}')">删除</button>`);
}
function saveIngName(dow,slot,xi,old){
  const v=$('eIngName').value.trim();
  if(!v){alert('食材不能为空');return;}
  const arr=S.menu[dow][slot][xi].i;
  const idx=arr.indexOf(old);
  if(idx>=0)arr[idx]=v;
  save();render();closeM();
}
function delIng(dow,slot,xi,ing){
  const arr=S.menu[dow][slot][xi].i;
  const idx=arr.indexOf(ing);
  if(idx>=0)arr.splice(idx,1);
  save();render();closeM();
}
function addIng(dow,slot,xi){
  openM('加食材',`
    <div class="f-label">菜名：${esc(S.menu[dow][slot][xi].n)}</div>
    <label class="f-label">新食材</label>
    <input id="eAddIng" placeholder="如：葱、姜">
    <div class="hint">多个食材用顿号「、」隔开。</div>`,
  `<button class="btn-s" onclick="closeM()">取消</button><button class="btn-p" onclick="saveAddIng(${dow},'${slot}',${xi})">添加</button>`);
}
function saveAddIng(dow,slot,xi){
  const v=$('eAddIng').value.trim();
  if(!v){alert('请输入食材');return;}
  v.split(/[、,，]/).forEach(s=>{s=s.trim();if(s)S.menu[dow][slot][xi].i.push(s);});
  save();render();closeM();
}

function openM(title,body,foot){
  $('mTitle').textContent=title;
  $('mBody').innerHTML=body;
  const f=$('mFoot');
  if(foot){f.style.display='flex';f.innerHTML=foot;}
  else f.style.display='none';
  $('mask').classList.add('on');
}
function closeM(){$('mask').classList.remove('on');}

function doImport(){
  $('fileInput').click();
}
function onFile(ev){
  const f=ev.target.files[0];
  if(!f)return;
  const rd=new FileReader();
  rd.onload=e=>{
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
      const menu=parseRows(rows);
      if(!menu){alert('没识别出菜谱，请确认表格是「星期 × 早餐/午餐/晚餐」的布局。');return;}
      openM('导入确认',`
        <p style="font-size:14px;line-height:1.7;margin:0">
          识别到 <strong>7 天</strong>菜谱（周一~周日）。<br><br>
          导入会<strong>覆盖</strong>当前菜谱数据（你手动改过的菜名/食材会被替换）。<br>
          已确认出库的记录不受影响。<br><br>确定导入吗？</p>`,
      `<button class="btn-s" onclick="closeM()">取消</button><button class="btn-p" onclick="commitImport()">确定导入</button>`);
      window._pendingMenu=menu;
    }catch(err){
      alert('解析失败：'+err.message);
    }
  };
  rd.readAsArrayBuffer(f);
  ev.target.value='';
}
function commitImport(){
  if(!window._pendingMenu)return;
  S.menu=window._pendingMenu;
  save();render();closeM();
  msg('✅ 菜谱已更新');
}
function parseRows(rows){
  // 找表头行：同一行里要同时出现「周一」和「周二」（排除只含"周天"的标题行）
  let headRow=-1;
  for(let r=0;r<Math.min(8,rows.length);r++){
    const joined=(rows[r]||[]).join('');
    if(/周一/.test(joined)&&/周二/.test(joined)){headRow=r;break;}
  }
  if(headRow<0)return null;
  const head=rows[headRow];
  const dayCols={};
  for(let c=0;c<head.length;c++){
    const v=String(head[c]||'').trim();
    const m=v.match(/^周([一二三四五六天日])$/);
    if(m){
      const map={'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'天':7,'日':7};
      dayCols[map[m[1]]]=c;
    }
  }
  if(Object.keys(dayCols).length<5)return null;
  const menu={1:{早:[],午:[],晚:[]},2:{早:[],午:[],晚:[]},3:{早:[],午:[],晚:[]},4:{早:[],午:[],晚:[]},5:{早:[],午:[],晚:[]},6:{早:[],午:[],晚:[]},7:{早:[],午:[],晚:[]}};
  let curSlot=null;
  for(let r=headRow+1;r<rows.length;r++){
    const row=rows[r]||[];
    const a=String(row[0]||'').trim();
    if(a.includes('早餐'))curSlot='早';
    else if(a.includes('午餐'))curSlot='午';
    else if(a.includes('晚餐'))curSlot='晚';
    if(!curSlot)continue;
    for(const d in dayCols){
      const c=dayCols[d];
      const name=String(row[c]||'').trim();
      if(!name)continue;
      if((name==='油'||name==='菜油'||name==='食用油')&&!String(row[c+1]||'').trim())continue;
      const ings=String(row[c+1]||'').trim().split(/[、,，\s]+/).filter(x=>x&&x!=='菜名'&&x!=='食材');
      menu[d][curSlot].push({n:name,i:ings.length?ings:[]});
    }
  }
  const total=Object.values(menu).reduce((s,d)=>s+Object.values(d).reduce((a,arr)=>a+arr.length,0),0);
  return total>=20?menu:null;
}

function openSet(){
  const ings=new Set();
  for(let d=1;d<=7;d++)for(const sl of SLOTS)S.menu[d][sl].forEach(x=>x.i.forEach(i=>ings.add(i)));
  const list=[...ings].sort((a,b)=>{
    const ca=catOf(a),cb=catOf(b);
    if(CAT_META[ca].order!==CAT_META[cb].order)return CAT_META[ca].order-CAT_META[cb].order;
    return a.localeCompare(b,'zh');
  });
  const rows=list.map(ing=>{
    return `<div class="cat-item"><span class="nm">${esc(ing)}</span>
      <select onchange="setCat('${esc(ing)}',this.value)">
        ${CATS.map(c=>`<option ${c===catOf(ing)?'selected':''}>${c}</option>`).join('')}
      </select></div>`;
  }).join('');
  openM('设置',`
    <div class="f-label">食材分类（点下拉可改，改完全局生效）</div>
    <div class="cat-list">${rows}</div>
    <div class="divider"></div>
    <div class="row2">
      <button class="btn-p" onclick="saveFile()">备份数据</button>
      <button class="btn-s" onclick="$('fileInput2').click()">恢复备份</button>
    </div>
    <input type="file" id="fileInput2" accept=".json" style="display:none" onchange="restoreFile(event)">
    <div class="divider"></div>
    <div class="f-label">版本与更新记录</div>
    <div id="verList">${CHANGELOG.map((c,i)=>`<div class="ver-entry">
      <div class="vh"><b>${c.version}</b><span>${c.date}</span>${i===0?'<span style="font-size:10px;color:var(--green)">当前</span>':''}</div>
      <ul>${c.items.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div>`).join('')}
    </div>
    <div class="hint" style="margin-top:14px">版本 ${APP_VERSION} · 更新于 ${APP_BUILD}</div>`,
  `<button class="btn-s" onclick="closeM()">关闭</button>`);
}
function setCat(ing,v){
  if(catOf(ing)===v){delete S.cat[ing];}
  else S.cat[ing]=v;
  save();
  openSet();
}

function saveFile(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='菜谱备份_'+iso(new Date())+'.json';
  a.click();
  msg('✅ 已导出备份');
}
function restoreFile(ev){
  const f=ev.target.files[0];
  if(!f)return;
  const rd=new FileReader();
  rd.onload=e=>{
    try{
      const d=JSON.parse(e.target.result);
      if(!d.menu){alert('备份文件格式不对');return;}
      S=d;
      if(!S.cat)S.cat={};if(!S.out)S.out={};
      save();render();closeM();
      msg('✅ 已恢复');
    }catch(err){alert('恢复失败：'+err.message);}
  };
  rd.readAsText(f);
  ev.target.value='';
}

let _msgT=null;
function msg(t){
  let el=document.getElementById('toast');
  if(!el){el=document.createElement('div');el.id='toast';
    document.body.appendChild(el);}
  el.textContent=t;el.style.opacity=1;
  clearTimeout(_msgT);
  _msgT=setTimeout(()=>{el.style.opacity=0;},2200);
}

function init(){
  $('verBadge').textContent=APP_VERSION;
  window._editing=false;
  cur=new Date();
  render();
}
init();
</script>
