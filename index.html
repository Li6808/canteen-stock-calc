<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="食堂出库">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#15171a">
<meta name="format-detection" content="telephone=no">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>食堂出库</title>
<style>
:root{
  --bg:#f5f6f7;--panel:#ffffff;--panel2:#f0f2f5;--line:#e5e8ec;--line2:#cfd5dd;
  --tx:#1a1c1f;--tx2:#5f6672;--tx3:#9aa2ad;
  --amber:#ba7517;--red:#c94f3d;--green:#4d8f4a;--blue:#2f6f8f;--purple:#7a4fd0;
  --amber-bg:#f6ecd8;--red-bg:#f9e6e2;--green-bg:#e7f0e4;--blue-bg:#e2ecf2;--purple-bg:#ece7f8;
  --orange:#d85a30;
  --r:10px;--r2:14px;
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
body{font-family:var(--font);background:var(--bg);color:var(--tx);font-size:15px;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
.wrap{max-width:760px;margin:0 auto;padding:0 12px 100px}

.top{position:sticky;top:0;z-index:50;background:var(--panel);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.top-in{display:flex;align-items:center;gap:10px;padding:10px 14px}
.brand{font-size:16px;font-weight:600;display:flex;align-items:baseline;gap:7px;min-width:0;flex:1 1 auto}
.brand b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .ver{font-size:10px;color:var(--tx3);font-weight:400;white-space:nowrap}
.top-btns{display:flex;gap:6px;flex:0 0 auto}
.icon-btn{font-size:13px;border:1px solid var(--line2);background:var(--panel);color:var(--tx);border-radius:8px;padding:6px 11px;cursor:pointer;white-space:nowrap}
.icon-btn:active{background:var(--panel2)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:14px;margin-bottom:14px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:2px 0 12px}
.sec-h .t{font-size:16px;font-weight:600}
.sec-h .s{font-size:12px;color:var(--tx3)}

.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head .ym{font-size:15px;font-weight:600}
.cal-nav{display:flex;gap:4px}
.cal-nav button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line2);background:var(--panel);color:var(--tx);font-size:16px;cursor:pointer}
.cal-nav button:active{background:var(--panel2)}
.cal-week{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center;margin-bottom:4px}
.cal-week span{font-size:11px;color:var(--tx3);padding:3px 0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-day{height:34px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:7px;font-size:13px;cursor:pointer;position:relative;border:1px solid transparent}
.cal-day.empty{cursor:default}
.cal-day.today{background:var(--blue-bg);color:var(--blue);font-weight:600}
.cal-day.sel{background:var(--tx);color:#fff;font-weight:600}
.cal-day.other{color:var(--tx3)}
.cal-day .done{position:absolute;bottom:3px;width:4px;height:4px;border-radius:50%;background:var(--green)}
.cal-day.sel .done{background:#fff}
.cal-legend{display:flex;gap:14px;margin-top:10px;font-size:11px;color:var(--tx2);flex-wrap:wrap}
.cal-legend span{display:inline-flex;align-items:center;gap:4px}
.cal-legend i{width:8px;height:8px;border-radius:3px;display:inline-block}

.sum-grid{display:grid;grid-template-columns:1fr;gap:0}
.sum-col .cat{font-size:12.5px;font-weight:600;margin:12px 0 6px;padding-left:7px;border-left:3px solid}
.sum-col .cat:first-child{margin-top:0}
.sum-col .cat.c-amber{border-color:var(--amber);color:var(--amber)}
.sum-col .cat.c-red{border-color:var(--red);color:var(--red)}
.sum-col .cat.c-green{border-color:var(--green);color:var(--green)}
.sum-col .cat.c-purple{border-color:var(--purple);color:var(--purple)}
.ing-row{display:flex;align-items:center;gap:8px;padding:5px 0 5px 10px;font-size:14px}
.ing-row .nm{font-weight:500;flex:1}
.ing-row .slots{display:flex;gap:4px;flex:0 0 auto}
.ing-row .slots .s{font-size:11px;color:var(--tx3)}
.ing-row .slots .s.mid{color:var(--orange);font-weight:600}
.obtn{font-size:11px;border:1px solid var(--blue);color:var(--blue);border-radius:6px;padding:3px 8px;white-space:nowrap;background:transparent;cursor:pointer;flex:0 0 auto}
.obtn.done{color:var(--green);border-color:var(--green);background:var(--green-bg);font-weight:600}

.slot-block{margin-bottom:14px}
.slot-block:last-child{margin-bottom:0}
.slot-tag{font-size:12px;color:var(--tx2);margin-bottom:8px}
.dish-row{display:flex;align-items:baseline;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}
.dish-row:last-child{border-bottom:0}
.dish-row .dn{font-weight:500;font-size:14px;flex:0 0 92px;cursor:pointer;word-break:break-all}
.dish-row .dn:active{color:var(--blue)}
.dish-row .ings{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:12px;padding:2px 8px;border-radius:6px;cursor:pointer}
.chip.c-amber{background:var(--amber-bg);color:var(--amber)}
.chip.c-red{background:var(--red-bg);color:var(--red)}
.chip.c-green{background:var(--green-bg);color:var(--green)}
.chip.c-purple{background:var(--purple-bg);color:var(--purple)}
.chip:active{opacity:.6}
.dish-row .add{font-size:11px;color:var(--tx3);cursor:pointer;padding:2px 6px;border:1px dashed var(--line2);border-radius:6px}

.card.lunch{border:2px solid var(--orange)}

.prog{display:flex;flex-direction:column;gap:6px;align-items:center}
.prog-bg{width:100%;height:8px;border-radius:4px;background:var(--panel2);overflow:hidden}
.prog-fill{height:100%;background:var(--green);border-radius:4px;transition:width .3s}
.prog-txt{font-size:12px;color:var(--tx2)}

.edit-mode .dish-row{border:1px dashed var(--line2);border-radius:9px;padding:7px 10px;margin-bottom:6px}
.edit-mode .dish-row:last-child{margin-bottom:0}
.edit-mode .del{font-size:11px;color:var(--red);border:1px solid var(--red);border-radius:6px;padding:2px 7px;cursor:pointer;flex:0 0 auto;white-space:nowrap}
.edit-mode .add-dish{display:flex;align-items:center;justify-content:center;gap:4px;border:1px dashed var(--blue);border-radius:9px;padding:9px;color:var(--blue);font-size:13px;cursor:pointer;margin-top:8px}
.icon-btn.editing{border-color:var(--orange);color:var(--orange);font-weight:600}

.divider{height:1px;background:var(--line);margin:14px 0}

.confirm-bar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--panel);border-top:1px solid var(--line);padding:10px 14px;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
.confirm-bar .btn{width:100%;padding:13px;border-radius:10px;border:0;font-size:15px;font-weight:600;cursor:pointer;color:#fff;background:var(--tx)}
.confirm-bar .btn.done{background:var(--green)}
.confirm-bar .btn:active{opacity:.85}

.mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:none;align-items:flex-end;justify-content:center}
.mask.on{display:flex}
.mbox{background:var(--panel);width:100%;max-width:600px;border-radius:16px 16px 0 0;max-height:88vh;display:flex;flex-direction:column}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.mhead h3{margin:0;font-size:15px;font-weight:600}
.mclose{width:30px;height:30px;border:0;background:var(--panel2);border-radius:50%;font-size:18px;cursor:pointer;color:var(--tx)}
.mbody{padding:16px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.mfoot{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.mfoot button{flex:1;padding:11px;border-radius:9px;font-size:14px;cursor:pointer}
.btn-p{background:var(--tx);color:#fff;border:0;font-weight:500}
.btn-s{background:var(--panel);color:var(--tx);border:1px solid var(--line2)}

.f-label{font-size:12px;color:var(--tx2);display:block;margin:12px 0 5px}
.f-label:first-child{margin-top:0}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--tx);background:var(--panel);border:1px solid var(--line2);border-radius:9px;padding:9px 11px}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--blue)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:12px;color:var(--tx3);line-height:1.6;margin-top:8px}

.cat-list{display:flex;flex-direction:column;gap:6px}
.cat-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:9px}
.cat-item .nm{flex:1;font-size:14px}
.cat-item select{width:auto;font-size:13px;padding:6px 8px}

.ver-entry{padding:10px 0;border-bottom:1px solid var(--line)}
.ver-entry:last-child{border-bottom:0}
.ver-entry .vh{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.ver-entry .vh b{font-size:13px}
.ver-entry .vh span{font-size:11px;color:var(--tx3)}
.ver-entry ul{margin:0;padding-left:17px}
.ver-entry li{font-size:12.5px;line-height:1.8;color:var(--tx2)}

#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;z-index:200;transition:opacity .3s;max-width:80%;opacity:0}

.tabbar{display:flex;gap:6px;margin:0 0 0 6px}
.tab{font-size:13px;border:1px solid var(--line2);background:var(--panel);color:var(--tx2);border-radius:8px;padding:6px 14px;cursor:pointer}
.tab.on{background:var(--tx);color:#fff;border-color:var(--tx);font-weight:600}
.out-form .f-row{margin-bottom:10px}
.out-form label{font-size:12px;color:var(--tx2);display:block;margin-bottom:4px}
.out-list .o-item{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.out-list .o-item:last-child{border-bottom:0}
.out-list .o-main{flex:1;min-width:0}
.out-list .o-name{font-weight:500}
.out-list .o-sub{font-size:11px;color:var(--tx3);margin-top:2px}
.out-list .o-amt{font-weight:600;color:var(--red);white-space:nowrap}
.out-list .o-del{font-size:11px;color:var(--red);border:1px solid var(--red);border-radius:6px;padding:3px 7px;cursor:pointer;background:transparent;white-space:nowrap}
.out-bar{position:sticky;bottom:0;display:flex;gap:8px;padding:10px 0;background:var(--panel);margin-top:6px}
.out-bar button{flex:1;padding:12px;border-radius:10px;font-size:14px;font-weight:600;border:0;cursor:pointer;color:#fff}
.out-bar .b-excel{background:var(--green)}
.out-bar .b-img{background:var(--blue)}
.o-edit{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.o-erow{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--panel)}
.o-erow.extra{border-style:dashed;background:#faf7f0}
.o-etop{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.o-ename{font-size:14px;font-weight:600;flex:1}
.o-ecat{font-size:11px;color:#fff;background:var(--blue);border-radius:6px;padding:2px 7px;white-space:nowrap}
.o-etag{font-size:10px;color:#fff;background:#c98a2b;border-radius:6px;padding:2px 6px}
.o-ebot{display:flex;align-items:center;gap:6px}
.o-eqty,.o-eprice{flex:1;min-width:0}
.o-eunit{width:62px;flex:0 0 62px;text-align:center}
.o-edel{font-size:11px;color:var(--red);border:1px solid var(--red);border-radius:6px;padding:3px 8px;background:transparent;white-space:nowrap;cursor:pointer}
.o-hidden{margin-top:8px;font-size:12px;color:var(--tx3)}
.o-restore{font-size:12px;color:var(--tx2);border:1px solid var(--line2);border-radius:6px;padding:3px 8px;background:var(--panel);cursor:pointer;margin:2px 4px 2px 0}
.tabbar{overflow-x:auto;max-width:100%}
/* 入库/一次性/月结/日报 通用 */
.mod-form .f-row{margin-bottom:8px}
.mod-form label{font-size:12px;color:var(--tx2);display:block;margin-bottom:4px}
.amt-prev{font-size:13px;color:var(--green);font-weight:600;text-align:right;padding:4px 2px}
.sum-bar{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.sum-chip{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 11px;font-size:13px}
.sum-chip b{font-size:15px;color:var(--tx)}
.sum-chip .lab{color:var(--tx3);font-size:11px;display:block;margin-bottom:1px}
.rec-list .o-item{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.rec-list .o-item:last-child{border-bottom:0}
.rec-list .o-main{flex:1;min-width:0}
.rec-list .o-sub{font-size:11px;color:var(--tx3);margin-top:2px}
.rec-list .o-amt{font-weight:600;color:var(--red);white-space:nowrap}
.pill{font-size:10px;color:#fff;background:var(--blue);border-radius:6px;padding:2px 6px;margin-left:4px}
/* 月结表 */
.tsettle{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
.tsettle th,.tsettle td{border:1px solid var(--line);padding:6px 7px;text-align:right}
.tsettle th{background:var(--panel);color:var(--tx2);font-weight:600}
.tsettle td.nm,.tsettle th.nm{text-align:left}
.tsettle tr.cat-head td{background:#fff7ec;font-weight:700;color:var(--tx)}
.tsettle tr.tot td{background:#f3f6fb;font-weight:700}
.chk-ok{color:var(--green);font-weight:700}
.chk-bad{color:var(--red);font-weight:700}
/* 分享卡片 */
.share-card{background:#fff;color:#1a1c1f;border:1px solid var(--line);border-radius:12px;padding:14px;font-family:ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;font-size:13px;line-height:1.6;margin-top:10px}
.dlabel{font-size:12px;color:var(--tx2);margin:12px 0 4px}

@media(max-width:420px){
  .dish-row .dn{flex:0 0 82px}
  .sum-grid{gap:4px 12px}
}
</style>
</head>
<body>
<div class="top">
  <div class="top-in">
    <div class="brand"><b>食堂出库</b><span class="ver" id="verBadge"></span></div>
    <div class="tabbar">
      <button class="tab on" id="tabMain" onclick="switchView('main')">菜谱</button>
      <button class="tab" id="tabOut" onclick="switchView('outbound')">出库</button>
      <button class="tab" id="tabIn" onclick="switchView('inbound')">入库</button>
      <button class="tab" id="tabOt" onclick="switchView('onetime')">一次性</button>
      <button class="tab" id="tabSettle" onclick="switchView('settle')">月结</button>
      <button class="tab" id="tabDaily" onclick="switchView('daily')">日报</button>
    </div>
    <div class="top-btns">
      <button class="icon-btn" id="btnImport" onclick="doImport()">导入菜谱</button>
      <button class="icon-btn" id="btnEdit" onclick="toggleEditMode()">改菜谱</button>
      <button class="icon-btn" onclick="openSet()">设置</button>
    </div>
  </div>
</div>

<div class="wrap" id="wrap"></div>

<div class="confirm-bar" id="confirmBar" style="display:none"></div>

<div class="mask" id="mask" onclick="if(event.target===this)closeM()">
  <div class="mbox">
    <div class="mhead"><h3 id="mTitle"></h3><button class="mclose" onclick="closeM()">×</button></div>
    <div class="mbody" id="mBody"></div>
    <div class="mfoot" id="mFoot" style="display:none"></div>
  </div>
</div>

<input type="file" id="fileInput" accept=".xlsx,.xls,.csv" style="display:none" onchange="onFile(event)">

<script src="xlsx.full.min.js"></script>
<script>
const APP_VERSION='V2.6';
const APP_BUILD='2026-11-14 22:30:00';
const CHANGELOG=[
  {version:'V2.6',date:'2026-11-14 22:30:00',items:[
    '首次打开自动灌入你 v1 结算表的真实数据：每日出库654条/入库/一次性出库/上月结余/食材档案/参数，月结直接对得上',
    '新增「入库」模块：登记采购进场（日期/单据号/分类/品名/数量/单价→金额自动算），可导出 Excel',

    '新增「日报」：选日期一键生成「营养午餐出库日报」可转发文本（复制/导出图片），不用再截图',

  if(c==='粮食')return '粮食类';
  if(c==='肉禽蛋')return '肉禽蛋类';
  if(c==='蔬菜'||c==='瓜果')return '蔬菜瓜果类';

let _am=null;
function archiveMap(){if(_am)return _am;_am={};(S.archive||[]).forEach(a=>{_am[a.name]={cat:a.cat,unit:a.unit};});return _am;}
function catOf(name){
  if(S.cat[name])return S.cat[name];
  const a=archiveMap()[name];
  if(a&&a.cat)return a.cat;
  if(/[鸡鸭猪牛羊鹅狗兔]/u.test(name)||name.includes('肉')||name.includes('排骨')||name.includes('蹄')||name.includes('蛋'))return '肉禽蛋';
  if(name.includes('油')||name.includes('盐')||name.includes('酱')||name.includes('醋')||name.includes('味精')||name.includes('鸡精')||name.includes('料酒')||name.includes('糖')||name.includes('椒')&&name.includes('胡'))return '油盐';
  if(name.includes('粉条')||name.includes('海带')||name.includes('木耳')||name.includes('紫菜')||name.includes('豆')&&!name.includes('芽')&&!name.includes('腐')||name.includes('玉米')||name.includes('香菇')||name.includes('米豆')||name.includes('花椒')||name.includes('花生')||name.includes('苕粉')||name.includes('水盐菜'))return '干鲜';
  if(name.includes('苹果')||name.includes('香蕉')||name.includes('橙')||name.includes('梨')||name.includes('葡萄')||name.includes('西瓜')||name.includes('果'))return '瓜果';
  return '蔬菜';
}
function unitOf(name){
  const a=archiveMap()[name];
  if(a&&a.unit)return a.unit;
  if(name.includes('蛋'))return '个';
  return '斤';
}

function load(){
  try{
    const d=JSON.parse(localStorage.getItem(LSKEY));
    if(!d||!d.menu)return null;
    if(!d.cat)d.cat={};
    if(!d.out)d.out={};
    if(!d.outDetail)d.outDetail={};
    if(!d.outbound)d.outbound=[];
    if(!d.outDel)d.outDel={};
    if(!d.inbound)d.inbound=[];
    if(!d.onetime)d.onetime=[];
    if(!d.balanceLast)d.balanceLast=[];
    if(!d.archive)d.archive=[];
    if(!d.params)d.params={school:'',month:'',maker:'',checker:'',principal:''};
    if(typeof d.seeded!=='boolean')d.seeded=false;
    return d;
  }catch(e){return null;}
}

function ensureSeed(){
  if(S.seeded)return;
  const sd=SEED;
  if((!S.outbound||S.outbound.length===0)&&sd.outbound){S.outbound=sd.outbound.map(r=>({id:rid(),...r}));}
  if((!S.onetime||S.onetime.length===0)&&sd.onetime){S.onetime=sd.onetime.map(r=>({id:rid(),...r}));}
  if((!S.inbound||S.inbound.length===0)&&sd.inbound){S.inbound=sd.inbound.map(r=>({id:rid(),...r}));}
  if((!S.balanceLast||S.balanceLast.length===0)&&sd.balanceLast){S.balanceLast=sd.balanceLast.map(r=>({id:rid(),...r}));}
  if((!S.archive||S.archive.length===0)&&sd.archive){S.archive=sd.archive.map(r=>({...r}));}
  if(sd.params){for(const k in sd.params){if(!S.params[k])S.params[k]=sd.params[k];}}
  S.seeded=true;save();
}
function rid(){return 'r'+Date.now()+'_'+Math.floor(Math.random()*1e6);}

function slotsOf(dow,ing){
  const s=[];
  SLOTS.forEach(sl=>{
    if(S.menu[dow][sl].some(x=>x.i.includes(ing)))s.push(sl==='早'?'早':sl==='午'?'中':'晚');
  });
  return s;
}

/* 当天食材总数（去重） */
function allIngs(dow,slot){
  const set=new Set();
  const slots=slot?[slot]:['早','午','晚'];
  slots.forEach(sl=>S.menu[dow][sl].forEach(x=>x.i.forEach(i=>set.add(i))));
  if(!slot||slot==='午')set.add('菜油');
  return [...set];
}
function countDishes(dow){return allIngs(dow).length;}
function countFilled(dow){
  const di=iso(cur);
  return allIngs(dow).filter(ing=>S.outDetail[di+'|'+ing]).length;
}
function toggleOb(ing,lunch){
  const di=iso(cur);
  const k=di+(lunch?'|午':'')+'|'+ing;   // 营养午餐用「日期|午|食材」独立记录，不与汇总联动
  if(S.outDetail[k])delete S.outDetail[k];
  else{
    S.outDetail[k]=true;
    // 全部填完则标记当天已出库（只统计汇总，不含营养午餐独立那份）
    if(countFilled(dowOf(cur))===countDishes(dowOf(cur)))S.out[di]=true;
  }
  // 若有撤销则同步取消当天整体标记
  if(S.out[di]&&countFilled(dowOf(cur))<countDishes(dowOf(cur)))delete S.out[di];
  save();render();
}

function calGrid(){
  const y=cur.getFullYear(),m=cur.getMonth();
  const first=new Date(y,m,1);
  const startDow=first.getDay()===0?7:first.getDay();
  const daysInMonth=new Date(y,m+1,0).getDate();
  const today=new Date();
  const tIso=iso(today);
  const selIso=iso(cur);
  let cells='';
  for(let i=1;i<startDow;i++)cells+='<div class="cal-day empty"></div>';
  for(let d=1;d<=daysInMonth;d++){
    const dt=new Date(y,m,d);
    const di=iso(dt);
    let cls='cal-day';
    if(di===tIso)cls+=' today';
    if(di===selIso)cls+=' sel';
    if(!S.out[di]&&di!==selIso&&di!==tIso)cls+=' other';
    const done=S.out[di]?'<span class="done"></span>':'';
    cells+=`<div class="${cls}" onclick="pick('${di}')">${d}${done}</div>`;
  }
  return cells;
}

function sumGrid(dow,slot,onlyLunch){
  const group={};
  CATS.forEach(c=>group[c]=[]);
  const seen=new Set();
  const slots=slot?[slot]:['早','午','晚'];
  slots.forEach(sl=>{
    S.menu[dow][sl].forEach(x=>{
      x.i.forEach(ing=>{
        if(seen.has(ing))return;
        seen.add(ing);
        group[catOf(ing)].push(ing);
      });
    });
  });
  if(!slot||slot==='午'){
    if(!seen.has('菜油'))group[catOf('菜油')].push('菜油');
  }
  const sortInCat=(c,arr)=>{
    if(c==='米油面蛋'){
      return arr.sort((a,b)=>{
        const ia=ING_ORDER.indexOf(a),ib=ING_ORDER.indexOf(b);
        if(ia>=0&&ib>=0)return ia-ib;
        if(ia>=0)return -1;if(ib>=0)return 1;
        return a.localeCompare(b,'zh');
      });
    }
    return arr;
  };
  const di=iso(cur);
  // 一列：按 CATS 顺序往下排
  return CATS.map(c=>{
    const arr=sortInCat(c,group[c]);
    if(!arr.length)return '';
    const meta=CAT_META[c];
    const rows=arr.map(ing=>{
      const s=onlyLunch?[]:slotsOf(dow,ing);
      const slotsHtml=s.map(sl=>`<span class="s${sl==='中'?' mid':''}">${sl}</span>`).join('');
      const doneKey=di+(onlyLunch?'|午':'')+'|'+ing;
      const done=S.outDetail[doneKey];
      return `<div class="ing-row">
        <span class="nm">${esc(ing)}</span>
        ${s.length?`<span class="slots">${slotsHtml}</span>`:''}
        <button class="obtn${done?' done':''}" onclick="toggleOb('${esc(ing)}',${onlyLunch?'true':'false'})">${done?'✓ 已填':'出库单'}</button>
      </div>`;
    }).join('');
    return `<div class="sum-col"><div class="cat ${meta.c}">${c}</div>${rows}</div>`;
  }).join('');
}

function slotBlock(dow,slot){
  const dishes=S.menu[dow][slot];
  const editing=window._editing;
  const rows=dishes.map((x,xi)=>{
    const chips=x.i.map(ing=>{
      const c=catOf(ing);
      return `<span class="chip ${CAT_META[c].c}" onclick="editIng(${dow},'${slot}',${xi},'${esc(ing)}')">${esc(ing)}</span>`;
    }).join('');
    return `<div class="dish-row">
      <span class="dn" onclick="editDish(${dow},'${slot}',${xi})">${esc(x.n)}</span>
      <span class="ings">${chips}${editing?`<span class="add" onclick="addIng(${dow},'${slot}',${xi})">+</span>`:''}</span>
      ${editing?`<span class="del" onclick="delDish(${dow},'${slot}',${xi})">删</span>`:''}
    </div>`;
  }).join('');
  const addBtn=editing?`<div class="add-dish" onclick="addDish(${dow},'${slot}')">＋ 加菜</div>`:'';
  return `<div class="slot-block">
    <div class="slot-tag">${SLOT_NAMES[slot]}</div>
    ${rows}${addBtn}
  </div>`;
}

function toggleEditMode(){
  window._editing=!window._editing;
  const btn=$('btnEdit');
  if(btn)btn.classList.toggle('editing',window._editing);
  render();
  if(window._editing)msg('编辑模式：可改菜名、改食材、加菜、删菜');
}
function delDish(dow,slot,xi){

function parseRows(rows){
  // 找表头行：同一行里要同时出现「周一」和「周二」（排除只含"周天"的标题行）
  let headRow=-1;
  for(let r=0;r<Math.min(8,rows.length);r++){
    const joined=(rows[r]||[]).join('');
    if(/周一/.test(joined)&&/周二/.test(joined)){headRow=r;break;}
  }
  if(headRow<0)return null;
  const head=rows[headRow];
  const dayCols={};
  for(let c=0;c<head.length;c++){
    const v=String(head[c]||'').trim();
    const m=v.match(/^周([一二三四五六天日])$/);
    if(m){
      const map={'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'天':7,'日':7};
      dayCols[map[m[1]]]=c;
    }
  }
  if(Object.keys(dayCols).length<5)return null;
  const menu={1:{早:[],午:[],晚:[]},2:{早:[],午:[],晚:[]},3:{早:[],午:[],晚:[]},4:{早:[],午:[],晚:[]},5:{早:[],午:[],晚:[]},6:{早:[],午:[],晚:[]},7:{早:[],午:[],晚:[]}};
  let curSlot=null;
  for(let r=headRow+1;r<rows.length;r++){
    const row=rows[r]||[];
    const a=String(row[0]||'').trim();
    if(a.includes('早餐'))curSlot='早';
    else if(a.includes('午餐'))curSlot='午';
    else if(a.includes('晚餐'))curSlot='晚';
    if(!curSlot)continue;
    for(const d in dayCols){
      const c=dayCols[d];
      const name=String(row[c]||'').trim();
      if(!name)continue;
      if((name==='油'||name==='菜油'||name==='食用油')&&!String(row[c+1]||'').trim())continue;
      const ings=String(row[c+1]||'').trim().split(/[、,，\s]+/).filter(x=>x&&x!=='菜名'&&x!=='食材');
      menu[d][curSlot].push({n:name,i:ings.length?ings:[]});
    }
  }
  const total=Object.values(menu).reduce((s,d)=>s+Object.values(d).reduce((a,arr)=>a+arr.length,0),0);
  return total>=20?menu:null;
}

function onOutDateChange(){ renderOutbound(); }

function renderOutbound(){
  if(!S.outbound)S.outbound=[];
  if(!S.outDel)S.outDel={};
  const wrap=$('wrap');

  const date=$('oDate').value||today;

  h+=`<div class="card out-form">

    anyBase=true;
    const rec=map[key];

    h+=`<div class="o-erow">

  const baseSet=new Set(base);
  const extras=(S.outbound||[]).filter(r=>r.date===date&&r.meal===meal&&!baseSet.has(r.name)&&!S.outDel[outKey(r.date,r.meal,r.name)]);
  extras.forEach(r=>{
    const key=outKey(r.date,r.meal,r.name);
    const unit=r.unit||outUnit(r.name);
    h+=`<div class="o-erow extra">
      <div class="o-etop"><span class="o-ename">${esc(r.name)}</span><span class="o-ecat">${catOf(r.name)}</span><span class="o-etag">加</span></div>
      <div class="o-ebot">
        <input class="o-eqty" type="number" step="0.01" inputmode="decimal" placeholder="数量" value="${r.qty||''}" oninput="setOutField('${key}','qty',this.value)">
        <input class="o-eunit" value="${esc(unit)}" oninput="setOutField('${key}','unit',this.value)">
        <input class="o-eprice" type="number" step="0.01" inputmode="decimal" placeholder="单价" value="${r.price||''}" oninput="setOutField('${key}','price',this.value)">
        <button class="o-edel" onclick="delOutIngredient('${key}')">删</button>
      </div>

    <button class="btn-p" style="width:100%;padding:11px;margin-top:8px" onclick="addOutIngredient()">＋ 加一道菜 / 食材</button>`;

let _oid=0;
function setOutField(key,field,val){
  if(!S.outbound)S.outbound=[];
  let rec=S.outbound.find(r=>outKey(r.date,r.meal,r.name)===key);
  if(!rec){
    const [date,meal,name]=key.split('|');
    rec={id:Date.now()+'_'+(_oid++),date,meal,name,unit:outUnit(name),cat:catOf(name),qty:0,price:0,user:'',note:''};
    S.outbound.push(rec);
  }
  if(field==='qty')rec.qty=parseFloat(val)||0;
  else if(field==='price')rec.price=parseFloat(val)||0;
  else if(field==='unit')rec.unit=val.trim()||rec.unit;
  save();
}
function addOutIngredient(){
  const date=$('oDate').value||iso(new Date());
  const meal=$('oMeal').value;
  const nm=prompt('加一道菜 / 食材的名称：','');
  if(!nm)return;
  const name=nm.trim();
  if(!name)return;
  const key=outKey(date,meal,name);
  if(S.outbound.some(r=>outKey(r.date,r.meal,r.name)===key)){msg('该食材已存在');return;}
  if(!S.outDel)S.outDel={};delete S.outDel[key];
  S.outbound.push({id:Date.now()+'_'+(_oid++),date,meal,name,unit:outUnit(name),cat:catOf(name),qty:0,price:0,user:'',note:''});
  save();renderOutbound();msg('✅ 已加：'+name);
}
function delOutIngredient(key){
  S.outbound=S.outbound.filter(r=>outKey(r.date,r.meal,r.name)!==key);
  if(!S.outDel)S.outDel={};
  S.outDel[key]=true;
  save();renderOutbound();
}
function restoreOutIngredient(date,meal,name){
  const key=outKey(date,meal,name);
  if(S.outDel)delete S.outDel[key];
  save();renderOutbound();msg('已恢复：'+name);
}
function delOutbound(id){
  S.outbound=S.outbound.filter(r=>r.id!==id);
  save();renderOutbound();
}
function exportExcel(){
  if(!S.outbound||S.outbound.length===0){msg('还没有出库记录');return;}
  const aoa=[['日期','星期','餐次','分类','品名','单位','数量','单价(元)','金额(元)','领用人','备注']];
  S.outbound.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(r=>{
    aoa.push([r.date,wdName(r.date),r.meal,r.cat,r.name,r.unit,r.qty,r.price,+(r.qty*r.price).toFixed(2),r.user,r.note]);
  });
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols']=[{wch:11},{wch:6},{wch:8},{wch:8},{wch:12},{wch:6},{wch:8},{wch:9},{wch:10},{wch:8},{wch:14}];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'每日出库');
  XLSX.writeFile(wb,'食堂出库_'+iso(new Date())+'.xlsx');
  msg('✅ 已导出 Excel');
}
function exportLunchImage(){
  const date=$('oDate').value||iso(new Date());
  const list=(S.outbound||[]).filter(r=>r.date===date&&r.meal==='午');
  if(list.length===0){msg('当天午餐没有出库记录');return;}
  const c=document.createElement('canvas');
  const W=720,pad=24,rowH=46,headH=70;
  const H=headH+40+list.length*rowH+40;

// ============ 通用小工具 ============
function cjkLen(s){let n=0;for(const ch of String(s))n=/[一-鿿　-ヿ＀-￯]/.test(ch)?2:1;return n;}
function pad(s,n){s=String(s);while(cjkLen(s)<n)s+=' ';return s;}
function fmtN(n){return (Math.round((+n||0)*100)/100).toString();}
function uStr(u){return u||'';}

// ============ 入库 ============
function renderInbound(){
  if(!S.inbound)S.inbound=[];
  const wrap=$('wrap'); const today=iso(new Date());
  const list=S.inbound.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const total=list.reduce((s,r)=>s+(+r.amount||0),0);
  let h=`<div class="card mod-form">
    <div class="sec-h"><span class="t">本月入库</span><span class="s">采购进场登记</span></div>
    <div class="f-row"><label>日期</label><input type="date" id="iDate" value="${today}"></div>
    <div class="f-row"><label>单据号</label><input id="iDoc" placeholder="选填"></div>
    <div class="f-row"><label>分类</label><select id="iCat" onchange="fillNames('iCat','iNameList','iName','iUnit')">${CATS.map(c=>`<option>${c}</option>`).join('')}</select></div>
    <div class="f-row"><label>品名</label><input id="iName" list="iNameList" placeholder="如：大米" oninput="autoUnit('iName','iUnit')"><datalist id="iNameList"></datalist></div>
    <div class="row2">
      <div class="f-row"><label>单位</label><input id="iUnit" placeholder="斤"></div>
      <div class="f-row"><label>数量</label><input type="number" id="iQty" step="0.01" inputmode="decimal" placeholder="0" oninput="prevAmt('iQty','iPrice','iPrev')"></div>
    </div>
    <div class="f-row"><label>单价(元)</label><input type="number" id="iPrice" step="0.01" inputmode="decimal" placeholder="0" oninput="prevAmt('iQty','iPrice','iPrev')"></div>
    <div class="amt-prev" id="iPrev">金额：0.00 元</div>
    <div class="row2">
      <div class="f-row"><label>供应商</label><input id="iSup" placeholder="选填"></div>
      <div class="f-row"><label>验收人</label><input id="iChk" placeholder="选填"></div>
    </div>
    <div class="f-row"><label>备注</label><input id="iNote" placeholder="选填"></div>
    <button class="btn-p" style="width:100%;padding:11px;margin-top:6px" onclick="addInbound()">＋ 添加入库记录</button>
  </div>`;
  h+=`<div class="card"><div class="sec-h"><span class="t">入库明细</span><span class="s">${list.length}条 · 合计 ${total.toFixed(2)}元</span></div><div class="rec-list">`;
  if(list.length===0)h+=`<div class="hint">还没有入库记录。</div>`;
  list.slice().reverse().forEach(r=>{
    h+=`<div class="o-item"><div class="o-main"><div class="o-name">${esc(r.name)} <span class="pill">${esc(r.cat||catOf(r.name))}</span></div><div class="o-sub">${r.date||''} ${r.qty}${esc(uStr(r.unit))} × ${r.price}元${r.docNo?(' · 单'+esc(r.docNo)):''}${r.supplier?(' · '+esc(r.supplier)):''}</div></div><div class="o-amt">${(+r.amount||0).toFixed(2)}</div><button class="o-del" onclick="delRec('inbound','${r.id}')">删</button></div>`;
  });
  h+=`</div></div>`;
  h+=`<div class="out-bar"><button class="b-excel" onclick="exportInbound()">导出 Excel</button></div>`;
  wrap.innerHTML=h; fillNames('iCat','iNameList','iName','iUnit');
}
function addInbound(){
  const date=$('iDate').value, docNo=$('iDoc').value.trim(), cat=$('iCat').value,
    name=$('iName').value.trim(), unit=$('iUnit').value.trim()||unitOf(name),
    qty=parseFloat($('iQty').value)||0, price=parseFloat($('iPrice').value)||0,
    supplier=$('iSup').value.trim(), checker=$('iChk').value.trim(), note=$('iNote').value.trim();
  if(!name){msg('请填品名');return;}
  if(qty<=0||price<=0){msg('请填数量和单价');return;}
  S.inbound.push({id:rid(),date,docNo,cat,name,unit,qty,price,amount:+(qty*price).toFixed(2),supplier,checker,note});
  save();renderInbound();msg('✅ 已添加');
}
function exportInbound(){
  if(!S.inbound||S.inbound.length===0){msg('还没有入库记录');return;}
  const aoa=[['日期','单据号','分类','品名','单位','数量','单价(元)','入库金额(元)','供应商','验收人','备注']];
  S.inbound.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')).forEach(r=>{aoa.push([r.date,r.docNo,r.cat,r.name,r.unit,r.qty,r.price,r.amount,r.supplier,r.checker,r.note]);});
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols']=[{wch:11},{wch:8},{wch:8},{wch:10},{wch:6},{wch:8},{wch:9},{wch:11},{wch:10},{wch:8},{wch:12}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'本月入库');
  XLSX.writeFile(wb,'食堂入库_'+iso(new Date())+'.xlsx');msg('✅ 已导出');
}

  let h=`<div class="card mod-form">
    <div class="sec-h"><span class="t">一次性出库 / 低值易耗（杂支）</span><span class="s">单独列示</span></div>
    <div class="f-row"><label>日期</label><input type="date" id="oDate2" value="${today}"></div>
    <div class="f-row"><label>分类</label><select id="oCat2" onchange="fillNames('oCat2','oNameList2','oName2','oUnit2')">${CATS.map(c=>`<option>${c}</option>`).join('')}</select></div>
    <div class="f-row"><label>品名</label><input id="oName2" list="oNameList2" placeholder="如：洗涤剂" oninput="autoUnit('oName2','oUnit2')"><datalist id="oNameList2"></datalist></div>
    <div class="row2">
      <div class="f-row"><label>单位</label><input id="oUnit2" placeholder="个"></div>
      <div class="f-row"><label>数量</label><input type="number" id="oQty2" step="0.01" inputmode="decimal" placeholder="0" oninput="prevAmt('oQty2','oPrice2','oPrev2')"></div>
    </div>
    <div class="f-row"><label>单价(元)</label><input type="number" id="oPrice2" step="0.01" inputmode="decimal" placeholder="0" oninput="prevAmt('oQty2','oPrice2','oPrev2')"></div>
    <div class="amt-prev" id="oPrev2">金额：0.00 元</div>
    <div class="row2">
      <div class="f-row"><label>用途</label><input id="oUse2" placeholder="选填"></div>
      <div class="f-row"><label>领用人</label><input id="oUser2" placeholder="选填"></div>
    </div>
    <div class="f-row"><label>备注</label><input id="oNote2" placeholder="选填"></div>
    <button class="btn-p" style="width:100%;padding:11px;margin-top:6px" onclick="addOnetime()">＋ 添加一次性出库</button>
  </div>`;
  h+=`<div class="card"><div class="sec-h"><span class="t">一次性出库明细</span><span class="s">${list.length}条 · 合计 ${total.toFixed(2)}元</span></div><div class="rec-list">`;
  if(list.length===0)h+=`<div class="hint">还没有一次性出库记录。</div>`;
  list.slice().reverse().forEach(r=>{
    h+=`<div class="o-item"><div class="o-main"><div class="o-name">${esc(r.name)} <span class="pill">${esc(r.cat||catOf(r.name))}</span></div><div class="o-sub">${r.date||''} ${r.qty}${esc(uStr(r.unit))} × ${r.price}元${r.use?(' · '+esc(r.use)):''}${r.user?(' · '+esc(r.user)):''}</div></div><div class="o-amt">${(+r.amount||0).toFixed(2)}</div><button class="o-del" onclick="delRec('onetime','${r.id}')">删</button></div>`;
  });
  h+=`</div></div>`;
  h+=`<div class="out-bar"><button class="b-excel" onclick="exportOnetime()">导出 Excel</button></div>`;
  wrap.innerHTML=h; fillNames('oCat2','oNameList2','oName2','oUnit2');
}
function addOnetime(){
  const date=$('oDate2').value, cat=$('oCat2').value, name=$('oName2').value.trim(),
    unit=$('oUnit2').value.trim()||unitOf(name), qty=parseFloat($('oQty2').value)||0, price=parseFloat($('oPrice2').value)||0,
    use=$('oUse2').value.trim(), user=$('oUser2').value.trim(), note=$('oNote2').value.trim();
  if(!name){msg('请填品名');return;} if(qty<=0||price<=0){msg('请填数量和单价');return;}
  S.onetime.push({id:rid(),date,cat,name,unit,qty,price,amount:+(qty*price).toFixed(2),use,user,note});
  save();renderOnetime();msg('✅ 已添加');
}
function exportOnetime(){
  if(!S.onetime||S.onetime.length===0){msg('还没有一次性出库记录');return;}
  const aoa=[['日期','分类','品名','单位','数量','单价(元)','金额(元)','用途','领用人','备注']];
  S.onetime.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')).forEach(r=>{aoa.push([r.date,r.cat,r.name,r.unit,r.qty,r.price,r.amount,r.use,r.user,r.note]);});
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols']=[{wch:11},{wch:8},{wch:10},{wch:6},{wch:8},{wch:9},{wch:10},{wch:10},{wch:8},{wch:12}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'一次性出库');
  XLSX.writeFile(wb,'食堂一次性出库_'+iso(new Date())+'.xlsx');msg('✅ 已导出');
}

// 名称/单位联动
function fillNames(catId,listId,nameId,unitId){
  const cat=$(catId).value; const dl=$(listId); if(!dl)return;
  dl.innerHTML=(S.archive||[]).filter(a=>a.cat===cat).map(a=>`<option value="${esc(a.name)}">`).join('');
}
function autoUnit(nameId,unitId){const nm=$(nameId).value.trim();const a=archiveMap()[nm];if(a&&a.unit)$(unitId).value=a.unit;}
function prevAmt(qid,pid,previd){const q=parseFloat($(qid).value)||0,p=parseFloat($(pid).value)||0;const el=$(previd);if(el)el.textContent='金额：'+(q*p).toFixed(2)+' 元';}
function delRec(arr,id){S[arr]=S[arr].filter(r=>r.id!==id);save();if(view==='inbound')renderInbound();else if(view==='onetime')renderOnetime();else if(view==='settle')renderSettle();else if(view==='daily')renderDaily();}

// ============ 月结 ============
function computeSettle(){
  const inb={},last={},noon={},ewb={};
  (S.inbound||[]).forEach(r=>{inb[r.name]=(inb[r.name]||0)+(+r.amount||0);});
  (S.balanceLast||[]).forEach(r=>{last[r.name]=(last[r.name]||0)+(+r.amount||0);});
  (S.outbound||[]).forEach(r=>{const a=+(r.amount||r.qty*r.price||0);if(r.meal==='午')noon[r.name]=(noon[r.name]||0)+a;else ewb[r.name]=(ewb[r.name]||0)+a;});
  const names=new Set([...Object.keys(inb),...Object.keys(last),...Object.keys(noon),...Object.keys(ewb)]);
  const rows=[...names].map(nm=>{
    const ci=inb[nm]||0,ln=last[nm]||0,no=noon[nm]||0,ew=ewb[nm]||0,out=no+ew;
    const arc=(S.archive||[]).find(a=>a.name===nm);
    return {name:nm,cat:arc?arc.cat:catOf(nm),inb:ci,noon:no,ew,out,last:ln,bal:ln+ci-out};
  });
  const groups={};
  rows.forEach(r=>{const g=settleCat(r.cat);(groups[g]=groups[g]||[]).push(r);});
  const order=['粮食类','肉禽蛋类','蔬菜瓜果类','油辅干货类'];
  let tInb=0,tNoon=0,tEw=0,tOut=0,tLast=0,tBal=0;
  rows.forEach(r=>{tInb+=r.inb;tNoon+=r.noon;tEw+=r.ew;tOut+=r.out;tLast+=r.last;tBal+=r.bal;});
  const tOt=(S.onetime||[]).reduce((s,r)=>s+(+r.amount||0),0);
  return {rows,groups,order,tInb,tNoon,tEw,tOut,tLast,tBal,tOt};
}
function renderSettle(){
  const c=computeSettle();
  const wrap=$('wrap');
  let h=`<div class="card"><div class="sec-h"><span class="t">月结对账单</span><span class="s">${esc(S.params.school||'')} ${esc(S.params.month||'')}</span></div>`;
  h+=`<div class="sum-bar">
    <div class="sum-chip"><span class="lab">上月余额</span><b>${c.tLast.toFixed(2)}</b></div>
    <div class="sum-chip"><span class="lab">本月入库</span><b>${c.tInb.toFixed(2)}</b></div>
    <div class="sum-chip"><span class="lab">出库合计</span><b>${c.tOut.toFixed(2)}</b></div>
    <div class="sum-chip"><span class="lab">营养午餐</span><b>${c.tNoon.toFixed(2)}</b></div>
    <div class="sum-chip"><span class="lab">早/晚</span><b>${c.tEw.toFixed(2)}</b></div>
    <div class="sum-chip"><span class="lab">本月余额</span><b>${c.tBal.toFixed(2)}</b></div>
    <div class="sum-chip"><span class="lab">一次性(杂支)</span><b>${c.tOt.toFixed(2)}</b></div>
  </div>`;
  h+=`<table class="tsettle"><thead><tr><th class="nm">原材料名称</th><th class="nm">类别</th><th>本月入库</th><th>营养午餐</th><th>早/晚</th><th>出库合计</th><th>上月余额</th><th>本月余额</th></tr></thead><tbody>`;
  c.order.forEach(g=>{
    const grp=c.groups[g]||[];if(grp.length===0)return;
    let gInb=0,gNoon=0,gEw=0,gOut=0,gLast=0,gBal=0;
    grp.forEach(r=>{gInb+=r.inb;gNoon+=r.noon;gEw+=r.ew;gOut+=r.out;gLast+=r.last;gBal+=r.bal;});
    h+=`<tr class="cat-head"><td colspan="2">${g}</td><td>${gInb.toFixed(2)}</td><td>${gNoon.toFixed(2)}</td><td>${gEw.toFixed(2)}</td><td>${gOut.toFixed(2)}</td><td>${gLast.toFixed(2)}</td><td>${gBal.toFixed(2)}</td></tr>`;
    grp.sort((a,b)=>b.out-a.out).forEach(r=>{
      h+=`<tr><td class="nm">${esc(r.name)}</td><td class="nm">${esc(r.cat)}</td><td>${r.inb.toFixed(2)}</td><td>${r.noon.toFixed(2)}</td><td>${r.ew.toFixed(2)}</td><td>${r.out.toFixed(2)}</td><td>${r.last.toFixed(2)}</td><td>${r.bal.toFixed(2)}</td></tr>`;
    });
  });
  h+=`<tr class="tot"><td colspan="2">合计</td><td>${c.tInb.toFixed(2)}</td><td>${c.tNoon.toFixed(2)}</td><td>${c.tEw.toFixed(2)}</td><td>${c.tOut.toFixed(2)}</td><td>${c.tLast.toFixed(2)}</td><td>${c.tBal.toFixed(2)}</td></tr>`;
  h+=`</tbody></table>`;
  h+=`<div class="dlabel">杂支（一次性出库 / 低值易耗，单独列示，不计入上方食材余额）</div>`;
  h+=`<table class="tsettle"><thead><tr><th class="nm">品名</th><th class="nm">分类</th><th>金额(元)</th></tr></thead><tbody>`;
  (S.onetime||[]).slice().sort((a,b)=>(b.amount||0)-(a.amount||0)).forEach(r=>{h+=`<tr><td class="nm">${esc(r.name)}</td><td class="nm">${esc(r.cat||catOf(r.name))}</td><td>${(+r.amount||0).toFixed(2)}</td></tr>`;});
  h+=`<tr class="tot"><td colspan="2">一次性出库合计</td><td>${c.tOt.toFixed(2)}</td></tr></tbody></table>`;
  const ok=Math.abs(c.tLast+c.tInb-c.tOut-c.tBal)<0.01;
  h+=`<div style="margin-top:10px;font-size:14px" class="${ok?'chk-ok':'chk-bad'}">${ok?'✅ 平衡校验通过':'❌ 平衡校验未通过'}：上月余额 ${c.tLast.toFixed(2)} ＋ 入库 ${c.tInb.toFixed(2)} － 出库 ${c.tOut.toFixed(2)} ＝ 本月余额 ${c.tBal.toFixed(2)}</div>`;
  h+=`<div class="out-bar"><button class="b-excel" onclick="exportSettle()">导出月结 Excel</button></div>`;
  wrap.innerHTML=h;
}
function exportSettle(){
  const c=computeSettle();
  const aoa=[['原材料名称','类别','本月入库','营养午餐','早/晚','出库合计','上月余额','本月余额']];
  c.order.forEach(g=>{(c.groups[g]||[]).forEach(r=>aoa.push([r.name,r.cat,r.inb,r.noon,r.ew,r.out,r.last,r.bal]));});
  aoa.push(['合计','',c.tInb,c.tNoon,c.tEw,c.tOut,c.tLast,c.tBal]);
  aoa.push([]);aoa.push(['杂支（一次性出库）','','','','','','','']);
  (S.onetime||[]).forEach(r=>aoa.push([r.name,r.cat,'','','','','',(+r.amount||0)]));
  aoa.push(['一次性出库合计','','','','','','',c.tOt]);
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'月度结算');
  XLSX.writeFile(wb,'食堂月结_'+(S.params.month||iso(new Date()))+'.xlsx');msg('✅ 已导出');
}

// ============ 日报（营养午餐可转发卡片） ============
let dailyDate=iso(new Date());
function amtOf(r){return +(r.amount||r.qty*r.price||0);}
function renderDaily(){
  const wrap=$('wrap');
  const date=dailyDate, wk=wdName(date);
  const lunch=(S.outbound||[]).filter(r=>r.date===date&&r.meal==='午');
  const lunchTotal=lunch.reduce((s,r)=>s+amtOf(r),0);
  const byCat={};
  lunch.forEach(r=>{const c=settleCat(r.cat||catOf(r.name));byCat[c]=(byCat[c]||0)+amtOf(r);});
  const order=['粮食类','肉禽蛋类','蔬菜瓜果类','油辅干货类'];
  const dayAll=(S.outbound||[]).filter(r=>r.date===date);
  const dayTotal=dayAll.reduce((s,r)=>s+amtOf(r),0);
  const dayEw=dayAll.filter(r=>r.meal!=='午').reduce((s,r)=>s+amtOf(r),0);
  let lines=[];
  lines.push('【营养午餐出库日报】');
  lines.push((S.params.school||'学校')+' · '+date+' '+wk);
  lines.push('────────────────');
  lunch.slice().sort((a,b)=>amtOf(b)-amtOf(a)).forEach(r=>{
    lines.push(pad(r.name,6)+' '+fmtN(r.qty)+uStr(r.unit)+' × '+fmtN(r.price)+' = '+amtOf(r).toFixed(2));
  });
  lines.push('────────────────');
  lines.push('合计：'+lunchTotal.toFixed(2)+' 元');
  lines.push('分类：'+order.filter(c=>byCat[c]).map(c=>c+' '+byCat[c].toFixed(2)).join(' / '));
  const text=lines.join('\n');
  let h=`<div class="card mod-form">
    <div class="sec-h"><span class="t">每日日报</span><span class="s">生成可转发的总数据</span></div>
    <div class="f-row"><label>日期</label><input type="date" id="dDate" value="${date}" onchange="dailyDate=this.value;renderDaily()"></div>
    <div class="sum-bar">
      <div class="sum-chip"><span class="lab">当日出库合计</span><b>${dayTotal.toFixed(2)}</b></div>
      <div class="sum-chip"><span class="lab">营养午餐</span><b>${lunchTotal.toFixed(2)}</b></div>
      <div class="sum-chip"><span class="lab">早/晚</span><b>${dayEw.toFixed(2)}</b></div>
    </div>
    <div class="dlabel">营养午餐出库清单（可复制转发，不用截图）</div>
    <div class="share-card" id="lunchCard">${esc(text)}</div>
    <div class="row2" style="margin-top:8px">
      <button class="btn-p" onclick="copyText('lunchCard')">📋 复制文本</button>
      <button class="btn-s" onclick="exportDailyImg()">🖼 导出图片</button>
    </div>
  </div>`;
  h+=`<div class="card"><div class="sec-h"><span class="t">${date} 当日出库明细</span><span class="s">${dayAll.length}条 · ${dayTotal.toFixed(2)}元</span></div><div class="rec-list">`;
  if(dayAll.length===0)h+=`<div class="hint">当天没有出库记录。</div>`;
  dayAll.slice().sort((a,b)=>amtOf(b)-amtOf(a)).forEach(r=>{
    h+=`<div class="o-item"><div class="o-main"><div class="o-name">${esc(r.name)} <span class="pill">${esc(r.meal)}·${esc(r.cat||catOf(r.name))}</span></div><div class="o-sub">${r.qty}${esc(uStr(r.unit))} × ${r.price}元</div></div><div class="o-amt">${amtOf(r).toFixed(2)}</div></div>`;
  });
  h+=`</div></div>`;
  wrap.innerHTML=h;
}
function copyText(id){const el=$(id);const t=el.innerText||el.textContent;if(navigator.clipboard){navigator.clipboard.writeText(t).then(()=>msg('✅ 已复制，可直接转发'),()=>msg('复制失败，请手动选择'));}else{msg('当前环境不支持复制');}}
function exportDailyImg(){
  const el=$('lunchCard');if(!el)return;
  const text=el.innerText||el.textContent;
  const c=document.createElement('canvas');
  const W=720,pad=24,lineH=30,headH=18;
  const lines=text.split('\n');
  const H=headH+lines.length*lineH+24;
  c.width=W;c.height=H;const x=c.getContext('2d');
  x.fillStyle='#ffffff';x.fillRect(0,0,W,H);
  x.fillStyle='#1a1c1f';x.font='16px ui-monospace,Menlo,Consolas,monospace';x.textBaseline='top';
  lines.forEach((ln,i)=>{x.fillText(ln,pad,headH+i*lineH);});
  const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='营养午餐日报_'+dailyDate+'.png';a.click();
  msg('✅ 图片已导出');
}

function init(){
  $('verBadge').textContent=APP_VERSION;
  window._editing=false;
  ensureSeed();
  cur=new Date();
  render();
}
init();
</script>
