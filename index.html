<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="食堂出库">
<meta name="theme-color" content="#12634c">
<title>食堂出库</title>
<style>
:root{
  --bg:#f4f6f7;--card:#fff;--line:#e8ecea;--tx:#111a16;--tx2:#5c6b64;--tx3:#93a09a;
  --brand:#1a7f63;--brand-2:#0e5a45;--brand-soft:#e7f3ee;--amber:#a96b00;--amber-soft:#fdf3e2;
  --red:#b03a2e;--red-soft:#fbe9e6;--r:18px;
  --shadow:0 1px 2px rgba(16,40,32,.05),0 8px 24px rgba(16,40,32,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overflow-x:hidden;max-width:100%}
body{background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased}
header{background:linear-gradient(150deg,#1d8a6b 0%,#12634c 55%,#0d5340 100%);
  padding:calc(env(safe-area-inset-top) + 18px) 18px 30px;color:#fff;border-radius:0 0 26px 26px;position:relative}
header:after{content:'';position:absolute;right:-40px;top:-60px;width:180px;height:180px;border-radius:50%;
  background:rgba(255,255,255,.06)}
.hd b{display:block;font-size:20px;font-weight:700;letter-spacing:.3px}
.hd span{display:block;font-size:12px;color:rgba(255,255,255,.72);margin-top:3px}
.chips{display:flex;gap:8px;margin-top:14px;position:relative;z-index:1}
.chip{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.16);border-radius:11px;
  padding:7px 11px;font-size:12px;color:#fff;backdrop-filter:blur(4px)}
.chip b{font-size:15px;font-weight:700;margin-right:3px}
main{padding:0 14px calc(96px + env(safe-area-inset-bottom));max-width:760px;margin:-16px auto 0;position:relative;z-index:2}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.h{display:flex;align-items:center;justify-content:space-between;margin:0 0 4px}
.h b{font-size:15px;font-weight:700;letter-spacing:.2px}
.tag{font-size:11px;padding:3px 9px;border-radius:8px;background:var(--brand-soft);color:var(--brand);font-weight:600}
.tag.nut{background:var(--amber-soft);color:var(--amber)}
.dt{display:flex;align-items:center;gap:8px;margin-bottom:12px;background:var(--card);border-radius:16px;
  padding:8px;box-shadow:var(--shadow)}
.dt button{border:0;background:#f1f5f3;border-radius:11px;width:36px;height:36px;font-size:17px;color:var(--brand);cursor:pointer}
.dt b{flex:1;text-align:center;font-size:14.5px;font-weight:600}
.dt .today{white-space:nowrap;min-width:56px;border:0;background:var(--brand-soft);color:var(--brand);border-radius:11px;padding:0 12px;height:36px;
  font-size:12.5px;font-weight:600;font-family:inherit;cursor:pointer}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #f1f4f3;min-width:0}
.row:last-child{border-bottom:0;padding-bottom:2px}
.nm{flex:1;min-width:0}
.nm b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm small{display:block;font-size:11.5px;color:var(--tx3);margin-top:1px}
.warn-t{color:var(--red);font-size:11px;margin-top:1px}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;flex:0 0 auto}
.sbtn{width:34px;height:40px;border:0;background:#f3f7f5;color:var(--brand);font-size:18px;line-height:1;cursor:pointer;font-family:inherit}
.sbtn:active{background:#e3efe9}
.q{width:58px;height:40px;border:0;text-align:center;font-size:16px;font-weight:700;color:var(--brand-2);
  font-family:inherit;background:#fff;padding:0}
.q:focus{outline:0;background:#f7fbf9}
.u{font-size:11.5px;color:var(--tx3);width:16px}
.btn{border:0;border-radius:14px;padding:14px;font-size:15px;font-family:inherit;font-weight:600;width:100%;cursor:pointer}
.btn.main{background:linear-gradient(135deg,#1d8a6b,#12634c);color:#fff;box-shadow:0 6px 16px rgba(18,99,76,.24)}
.btn.ghost{background:#fff;color:var(--brand);border:1.5px solid var(--brand-soft)}
.btn.warn{background:var(--red-soft);color:var(--red)}
.btn:active{transform:scale(.99);opacity:.92}
.muted{color:var(--tx3);font-size:12px}
.banner{background:var(--amber-soft);color:#8a5a00;border-radius:14px;padding:11px 13px;font-size:12px;
  margin-bottom:12px;line-height:1.55}
.banner b{color:#7a4f00}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi>div{background:var(--card);border-radius:16px;padding:13px 14px;box-shadow:var(--shadow)}
.kpi small{display:block;color:var(--tx3);font-size:11.5px;margin-bottom:5px}
.kpi b{font-size:20px;font-weight:700;color:var(--brand-2);letter-spacing:.3px}
input,select{font-family:inherit;font-size:15px;border:1px solid var(--line);border-radius:12px;padding:12px;
  background:#fbfcfc;color:var(--tx);width:100%}
input:focus,select:focus{outline:0;border-color:var(--brand);background:#fff}
label{display:block;font-size:12px;color:var(--tx2);margin:12px 0 5px;font-weight:600}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,8px);
  background:rgba(17,26,22,.95);color:#fff;padding:11px 18px;border-radius:14px;font-size:13px;z-index:60;
  opacity:0;transition:.22s;pointer-events:none;max-width:80%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
main table{width:100%;border-collapse:collapse;font-size:13px}
main th,main td{padding:9px 4px;border-bottom:1px solid #f1f4f3;text-align:right}
main th:first-child,main td:first-child{text-align:left}
main th{color:var(--tx3);font-weight:500;font-size:11.5px}
main tr:last-child td{border-bottom:0}
.empty{text-align:center;color:var(--tx3);padding:28px 0;font-size:13px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:40;background:rgba(255,255,255,.92);
  backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:0;padding:6px 0;font-size:10.5px;color:var(--tx3);font-family:inherit;
  cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--brand)}
nav button.on svg{stroke-width:2.1}
.sect{font-size:12px;color:var(--tx3);margin:14px 0 6px;font-weight:600;letter-spacing:.5px}


.seg{display:flex;gap:6px;margin:2px 0 10px}
.seg button{flex:1;border:1px solid var(--line);background:#fff;border-radius:11px;padding:8px 0;font-size:12.5px;color:var(--tx2);font-family:inherit;cursor:pointer}
.seg button.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.seg.segwrap{flex-wrap:wrap}
.seg.segwrap button{flex:0 0 auto;padding:8px 12px}
.dish{padding:10px 0;border-bottom:1px solid #f1f4f3}
.dish:last-child{border-bottom:0}
.dh{display:flex;align-items:center;justify-content:space-between}
.dh b{font-size:14.5px;font-weight:600}
.chips2{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.ingchip{display:inline-flex;align-items:center;gap:5px;background:#f1f6f4;color:var(--brand-2);
  border-radius:8px;padding:4px 8px;font-size:12px}
.ingchip i{font-style:normal;color:#9aa8a2;cursor:pointer;font-size:13px;line-height:1;padding:0 2px}
.ingadd{border:1px dashed var(--line);background:#fff;color:var(--tx3);border-radius:8px;
  padding:4px 8px;font-size:12px;font-family:inherit;cursor:pointer}
.mini{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 9px;font-size:12px;
  color:var(--tx2);font-family:inherit;cursor:pointer}
.mini.ok{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.pickrow{display:flex;gap:6px;margin-top:8px;align-items:center}
.pickrow select{flex:1;padding:8px;font-size:13px;border-radius:9px}
.q2{width:70px;padding:8px;font-size:13px;border-radius:9px;text-align:center}
.subcard{background:#f7faf9;border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:12px}
.btnbar{display:flex;gap:8px;margin-top:12px}
.btnbar .btn{flex:1}
.ov{position:fixed;inset:0;background:rgba(12,22,18,.72);z-index:90;display:flex;align-items:flex-start;
  justify-content:center;padding:14px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.ovin{background:#fff;border-radius:18px;padding:14px;max-width:520px;width:100%;display:flex;
  flex-direction:column;gap:10px;margin:auto}
.ovin img{width:100%;border-radius:10px;display:block}

.dishname{background:#fff;border:1px solid var(--line);color:var(--tx2);border-radius:8px;
  padding:3px 8px;font-size:12px}

.brow{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid #f1f4f3}
.brow:last-child{border-bottom:0}
.bday{flex:0 0 40px;font-size:12.5px;font-weight:600;color:var(--brand)}
.btxt{flex:1;min-width:0;font-size:12px;color:var(--tx2);line-height:1.6}

.c-amber{background:#fdf3e2;color:#a96b00}
.c-red{background:#fbe9e6;color:#b03a2e}
.c-green{background:#e7f3ee;color:#1a7f63}
.c-purple{background:#efe9fa;color:#6b4fa8}
.c-blue{background:#e4eef4;color:#2f6f8f}
.ichip{display:inline-flex;align-items:center;gap:5px;border-radius:8px;padding:3px 8px;font-size:12px}
.mpart{font-size:12px;color:var(--tx3);margin:14px 0 2px;font-weight:600;letter-spacing:.5px}
.dishline{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed #eef2f0}
.dishline:last-child{border-bottom:0}
.dishline .dn2{flex:0 0 92px;font-size:14.5px;font-weight:600;word-break:break-all}
.dishline .ings{display:flex;gap:6px;flex-wrap:wrap;flex:1;align-items:center}
.mhint{font-size:11px;color:var(--tx3);font-weight:400}

.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.calym{font-size:15px;font-weight:700}
.calnav{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 12px;font-size:15px;
  color:var(--tx2);font-family:inherit;cursor:pointer}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calwd{text-align:center;font-size:11px;color:var(--tx3);padding:2px 0 4px}
.calcell{height:38px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;
  font-size:13.5px;color:var(--tx);cursor:pointer;position:relative}
.calcell.empty{cursor:default}
.calcell.sel{background:#111a16;color:#fff;font-weight:700}
.calcell.today{color:var(--brand);font-weight:700}
.calcell.today.sel{color:#fff}
.calcell .d{position:absolute;bottom:4px;width:4px;height:4px;border-radius:50%;background:var(--brand)}
.calcell.sel .d{background:#fff}
.callegend{display:flex;gap:14px;margin-top:8px;font-size:11px;color:var(--tx2)}
.callegend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}

/* 档案页 */
#view .row .nm{display:flex;flex-direction:column;gap:4px}
#view .row .nm .ops{display:flex;gap:6px;align-items:center;margin-top:4px;flex-wrap:wrap}
.mini-sel{width:auto;flex:0 0 auto;padding:6px 8px;font-size:12.5px;border-radius:9px;background:#f7faf9}
.mini-num{width:82px;flex:0 0 82px;padding:6px 8px;font-size:13px;text-align:right;border-radius:9px;background:#f7faf9}
#view .row .nm small{font-size:11.5px;color:var(--tx3)}

.dishname{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);
  color:var(--tx2);border-radius:8px;padding:3px 6px 3px 9px;font-size:12px}
.dishx{border:0;background:#f2f6f4;color:#93a09a;border-radius:6px;width:20px;height:20px;font-size:14px;
  line-height:1;font-family:inherit;cursor:pointer;padding:0}
.dishx:active{background:#e3efe9;color:#b03a2e}

.ichip.off{background:#f1f3f2;color:#b8c2bd;text-decoration:line-through}
.usel{width:66px;flex:0 0 66px;border:1px solid var(--line);border-radius:9px;padding:9px 2px;font-size:12px;
  color:var(--tx2);background:#f7faf9;font-family:inherit}
#view .row .nm{min-width:0}

.azbar{position:fixed;right:3px;top:150px;z-index:25;display:flex;flex-direction:column;gap:1px;
  max-height:60vh;overflow-y:auto;padding:4px 2px;background:rgba(255,255,255,.86);
  border-radius:10px;box-shadow:0 2px 10px rgba(16,40,32,.08)}
.azbar button{border:0;background:transparent;font-size:10.5px;line-height:1;padding:4px 5px;
  color:var(--tx3);font-family:inherit;cursor:pointer;border-radius:6px}
.azbar button.on{background:var(--brand);color:#fff;font-weight:700}

.cover{border:1.5px solid #2b2b2b;border-radius:6px;padding:0;margin-top:10px;background:#fff;overflow:hidden}
.cvtitle{text-align:center;font-size:17px;font-weight:700;letter-spacing:6px;padding:12px 0;border-bottom:1.5px solid #2b2b2b}
.cvrow{display:flex;border-bottom:1px dashed #9aa39e}
.cvrow:last-of-type{border-bottom:1.5px solid #2b2b2b}
.cvlab{flex:0 0 76px;padding:10px 8px;font-size:12.5px;color:#333;background:#fafafa;border-right:1px dashed #9aa39e;letter-spacing:2px}
.cvval{flex:1;padding:10px 10px;font-size:13px;color:#111;min-width:0;word-break:break-all}
.cvval.big{font-size:18px;font-weight:700}
.cvsign{display:flex;justify-content:space-between;padding:12px 10px;font-size:12px;color:#333;flex-wrap:wrap;gap:6px}

.lgsum{margin-top:10px;background:var(--brand-soft);color:var(--brand-2);border-radius:10px;
  padding:10px 12px;font-size:14px;font-weight:700;text-align:right}

.ovin img{max-height:none;width:100%;height:auto}
</style>
</head>
<body>
<header><div class="hd"><b id="school">食堂出库</b><span id="sub"></span></div>
<div class="chips" id="chips"></div></header>
<main id="view"></main>
<nav id="tabs">
  <button data-t="today" class="on"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4M16 3v4M4 10h16"/><path d="M8 14h3M8 17h6"/></svg>今日</button>

  <button data-t="archive"><svg viewBox="0 0 24 24"><path d="M4 7h16v13H4z"/><path d="M4 7l2-3h12l2 3"/><path d="M9 12h6"/></svg>档案</button>
  <button data-t="month"><svg viewBox="0 0 24 24"><path d="M4 19V5"/><path d="M4 19h16"/><rect x="7" y="11" width="3" height="5" rx="1"/><rect x="12" y="8" width="3" height="8" rx="1"/><rect x="17" y="13" width="3" height="3" rx="1"/></svg>结算</button>
</nav>

function u16(b,o){return b[o]|(b[o+1]<<8);}
function u32(b,o){return (b[o]|(b[o+1]<<8)|(b[o+2]<<16)|(b[o+3]<<24))>>>0;}
async function inflateRaw(u8){
  if(typeof DecompressionStream!=='undefined'){
    var ds=new DecompressionStream('deflate-raw');
    var st=new Blob([u8]).stream().pipeThrough(ds);

async function unzip(buf){
  var out={},i=buf.length-22;
  while(i>0&&u32(buf,i)!==0x06054b50)i--;
  if(i<=0)throw new Error('不是有效的 xlsx');
  var n=u16(buf,i+10),off=u32(buf,i+16),p=off;
  for(var k=0;k<n;k++){
    if(u32(buf,p)!==0x02014b50)break;
    var method=u16(buf,p+10),csize=u32(buf,p+20),nameLen=u16(buf,p+28),extra=u16(buf,p+30),cmt=u16(buf,p+32);
    var name='';
    for(var j=0;j<nameLen;j++)name+=String.fromCharCode(buf[p+46+j]);
    var lho=u32(buf,p+42);
    var lnameLen=u16(buf,lho+26),lextra=u16(buf,lho+28);
    var dataOff=lho+30+lnameLen+lextra;
    var data=buf.subarray(dataOff,dataOff+csize);

    p+=46+nameLen+extra+cmt;
  }

}

}

async function readXlsx(file){
  var buf=new Uint8Array(await file.arrayBuffer());
  var zip=await unzip(buf);
  var shared=[];
  if(zip['xl/sharedStrings.xml']){
    var sx=decodeXml(zip['xl/sharedStrings.xml']);
    var items=sx.split('<si>').slice(1);
    items.forEach(function(si){
      var ts=si.match(/<t[^>]*>([\s\S]*?)<\/t>/g)||[];
      shared.push(ts.map(function(t){return t.replace(/<[^>]+>/g,'');}).join(''));
    });
  }

  var wx=decodeXml(zip['xl/workbook.xml']);
  var m,nameRe=/<sheet[^>]*name="([^"]*)"[^>]*r:id="rId(\d+)"/g,mm;
  while((mm=nameRe.exec(wx))){names.push(mm[1]);paths.push(+mm[2]);}

  var relMap={},rre=/Id="rId(\d+)"[^>]*Target="([^"]*)"/g,rr;
  while((rr=rre.exec(relx)))relMap[rr[1]]=rr[2];
  var result={};
  names.forEach(function(nm,idx){
    var t=relMap[String(paths[idx])]||('worksheets/sheet'+(idx+1)+'.xml');
    var path=t.indexOf('xl/')===0?t:('xl/'+t.replace(/^\/?/,''));
    var xml=zip[path];if(!xml)return;
    var doc=new DOMParser().parseFromString(decodeXml(xml),'application/xml');
    var rows=[];
    var rs=doc.getElementsByTagName('row');
    for(var i=0;i<rs.length;i++){
      var cells=rs[i].getElementsByTagName('c'),arr=[];
      for(var c=0;c<cells.length;c++){
        var cell=cells[c],ref=cell.getAttribute('r')||'',t2=cell.getAttribute('t');
        var ci=colIndex(ref),v='';
        if(t2==='inlineStr'){var is=cell.getElementsByTagName('t');if(is.length)v=is[0].textContent;}
        else{
          var vn=cell.getElementsByTagName('v');
          if(vn.length){v=vn[0].textContent;if(t2==='s')v=shared[+v]||'';}
        }
        arr[ci]=v;
      }
      rows.push(arr);
    }
    result[nm]=rows;
  });
  return result;
}

  });

}

/* ---------------- 未来预计 ---------------- */
function forecast(){
  var st=new Date(viewDate+'T00:00:00');
  var dels=[2,6],end=null,i,d;
  for(i=1;i<=8;i++){
    d=new Date(st.getTime());d.setDate(st.getDate()+i);
    if(dels.indexOf((d.getDay()+6)%7)>=0){end=d;break;}
  }
  var rows={},cur=new Date(st.getTime()),days=0;
  while(cur<end&&days<10){
    var wd=(cur.getDay()+6)%7;
    if(!isWeekend(wd))dayRows(wd,'午').forEach(function(n){rows[n]=(rows[n]||0)+refOf(wd,'午',n);});
    rows=rows;
    dayRows(wd,'早/晚').forEach(function(n){rows[n]=(rows[n]||0)+refOf(wd,'早/晚',n);});
    cur.setDate(cur.getDate()+1);days++;
  }
  return {end:end,days:days,rows:rows};
}

function doIssue(card,meal){
  var ins=card.querySelectorAll('input.q'),cnt=0,amt=0;
  var keep=S.outLog.filter(function(o){return !(o.d===viewDate&&o.t===meal);});
  var had=S.outLog.length!==keep.length;
  var rows=[];
  Array.prototype.forEach.call(ins,function(inp){

}

function slipPages(meal){
  var rows=S.outLog.filter(function(o){return o.d===viewDate&&o.t===meal;});
  if(!rows.length)return [];
  rows.sort(function(a,b){
    var ra=CAT_RANK[catOf(a.n)]||9,rb=CAT_RANK[catOf(b.n)]||9;
    if(ra!==rb)return ra-rb;
    return ORDER.indexOf(a.n)-ORDER.indexOf(b.n);
  });
  var PER=30,pages=[];
  var total=Math.ceil(rows.length/PER);
  for(var i=0;i<total;i++){
    var chunk=rows.slice(i*PER,(i+1)*PER);
    var pgStr=total>1?('第 '+(i+1)+' 页 / 共 '+total+' 页'):'';
    pages.push(slipURL(meal,chunk,pgStr));
  }
  return pages;
}
function showSlip(meal){

    dl.textContent=multi?('下载第 '+(cur+1)+' 页'):'下载图片';
  }
  prev.onclick=function(){if(cur>0){cur--;paint();}};
  next.onclick=function(){if(cur<pages.length-1){cur++;paint();}};
  dl.onclick=function(){
    var a=document.createElement('a');a.href=pages[cur];

function cnMoney(n){
  var D='零壹贰叁肆伍陆柒捌玖';
  var U=['','拾','佰','仟','万','拾','佰','仟','亿'];
  var v=Math.round(n*100), fen=v%10, jiao=Math.floor(v/10)%10, yuan=Math.floor(v/100);
  if(yuan===0&&jiao===0&&fen===0)return '零元整';
  var s='';
  if(yuan>0){
    var a=String(yuan).split('');
    for(var i=0;i<a.length;i++){
      var d=+a[i], pos=a.length-1-i;
      if(d===0){ if(s&&s.charAt(s.length-1)!=='零')s+='零'; }
      else s+=D.charAt(d)+U[pos];
    }
    s=s.replace(/零+$/,'')+'元';
  }
  if(jiao>0)s+=D.charAt(jiao)+'角';
  else if(fen>0&&yuan>0)s+='零';
  if(fen>0)s+=D.charAt(fen)+'分';
  else if(jiao>0)s+='整';
  else if(yuan>0)s+='整';
  return s;
}
var BLOCKS=[['粮食类','粮食'],['肉禽蛋类','肉禽蛋'],['蔬菜瓜果类','蔬菜|瓜果'],['油盐辅料干货','油盐|干鲜']];
function slipURL(meal,rows,pgStr){
  var groups=BLOCKS.map(function(b){
    var cats=b[1].split('|');
    var list=rows.filter(function(o){return cats.indexOf(catOf(o.n))>=0;});
    var sum=0;list.forEach(function(o){sum+=o.q*o.p;});
    return {name:b[0],list:list,sum:sum};
  });
  var W=760,pad=28;
  var headH=150, footH=170;
  var bodyH=0;
  groups.forEach(function(g){
    if(!g.list.length)return;
    bodyH+=30+30+g.list.length*30+30;
  });
  var H=headH+bodyH+footH;
  var sc=2;
  var c=document.createElement('canvas');
  c.width=W*sc;c.height=H*sc;
  var g=c.getContext('2d');
  g.scale(sc,sc);
  g.fillStyle='#fff';g.fillRect(0,0,W,H);
  g.fillStyle='#12402f';g.fillRect(0,0,W,8);

  var F=' -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';

  g.fillText(viewDate+'　'+DAYC[wdOf(viewDate)]+'　'+(meal==='午'?'营养午餐':(isWeekend(wdOf(viewDate))?'早、中、晚':'早、晚餐'))+(pgStr?'　'+pgStr:''),W/2,74);
  g.textAlign='right';g.font='400 11.5px'+F;
  g.fillText('编号：'+viewDate.replace(/-/g,'')+'-'+(meal==='午'?'W':'Z')+'-01',W-pad,74);

  var x0=pad,x1=W-pad;
  var cols=[[x0+10,'left','序号'],[x0+56,'left','品名'],[x0+300,'left','单位'],
            [x0+398,'right','数量'],[x0+500,'right','单价'],[x1-10,'right','金额']];
  g.fillStyle='#1a7f63';g.fillRect(x0,88,x1-x0,26);
  g.fillStyle='#fff';g.font='600 12.5px'+F;
  cols.forEach(function(cl){g.textAlign=cl[1];g.fillText(cl[2],cl[0],105);});

  var y=114,seq=0,grand=0;
  groups.forEach(function(grp){
    if(!grp.list.length)return;
    g.fillStyle='#eef4f1';g.fillRect(x0,y,x1-x0,26);
    g.fillStyle='#12402f';g.font='700 12.5px'+F;g.textAlign='left';
    g.fillText(grp.name,x0+10,y+18);
    y+=26;

      g.fillStyle='#111a16';g.font='400 12.5px'+F;
      g.textAlign='left';g.fillText(String(seq),x0+10,y+20);
      g.font='500 12.5px'+F;g.fillText(o.n,x0+56,y+20);
      g.font='400 12px'+F;g.fillStyle='#5c6b64';g.fillText(unitOf(o.n),x0+300,y+20);
      g.fillStyle='#111a16';
      g.textAlign='right';g.fillText(fmt(o.q),x0+398,y+20);
      g.fillText(fmt(o.p,2),x0+500,y+20);
      g.font='600 12.5px'+F;g.fillText(yen(o.q*o.p),x1-10,y+20);
      y+=30;
    });
    grand+=grp.sum;
    g.fillStyle='#fff';g.fillRect(x0,y,x1-x0,26);
    g.fillStyle='#5c6b64';g.font='400 12px'+F;g.textAlign='right';
    g.fillText('本类小计　¥'+yen(grp.sum),x1-10,y+18);

/* ---------------- 结算 ---------------- */
function oneStats(){
  var inAmt=0,outAmt=0;
  (S.oneLog||[]).forEach(function(o){
    if(o.dir==='in')inAmt+=o.q*o.p;
    else outAmt+=o.q*o.p;
  });
  return {inAmt:inAmt,outAmt:outAmt};
}
function dayMap(){
  var m={};
  S.outLog.forEach(function(o){
    if(!m[o.d])m[o.d]={nut:0,eve:0};
    if(o.t==='午')m[o.d].nut+=o.q*o.p;else m[o.d].eve+=o.q*o.p;
  });
  (S.oneLog||[]).forEach(function(o){
    if(!m[o.d])m[o.d]={nut:0,eve:0};
    if(!m[o.d].one)m[o.d].one=0;
    if(o.dir==='out')m[o.d].one+=o.q*o.p;
    else m[o.d].nin=(m[o.d].nin||0)+o.q*o.p;
  });
  return m;
}

var coverG='粮食类', coverK='非';
var GMAP={'粮食':'粮食类','油盐':'油辅干货类','干鲜':'油辅干货类','肉禽蛋':'肉禽蛋类',
          '蔬菜':'蔬菜瓜果类','瓜果':'蔬菜瓜果类'};
function rollName(n){
  var c=catOf(n);
  if(['瘦肉','三线肉','排骨','猪蹄'].indexOf(n)>=0)return '猪肉';
  if(n==='鸡')return '鲜鸡';
  if(n==='鸭')return '鲜鸭';
  if(n==='豆腐'||n==='豆干')return '蔬菜';
  if(c==='瓜果')return '水果';
  if(c==='蔬菜')return '蔬菜';
  if(c==='干鲜')return '干鲜';
  if(c==='油盐')return n==='菜油'?'菜油':(n==='盐'?'盐':'干鲜');
  return n;
}
function coverData(){
  var agg={},total=0;
  S.outLog.forEach(function(o){
    var g=lgGroup(o.n);
    if(g!=='蔬菜'&&g!=='水果')g=(g==='肉类'?'肉禽蛋类':(g==='粮食'?'粮食类':'油辅干货类'));
    else g='蔬菜瓜果类';
    var isNut=(o.t==='午');
    if((coverK==='营')!==isNut)return;
    if(g!==coverG)return;
    var k=rollName(o.n);
    agg[k]=(agg[k]||0)+o.q*o.p;
    total+=o.q*o.p;
  });
  var rows=Object.keys(agg).map(function(k){return {n:k,a:agg[k]};});
  rows.sort(function(x,y){return y.a-x.a;});
  return {rows:rows,total:total};
}
function coverTitle(){
  var mo=(S.month||'2026-11').split('-');
  var y=+mo[0],m=+mo[1];
  var season=(m>=9||m<=1)?'秋':'春';
  var school=String(S.school||'');
  var short=school.indexOf('第三中学')>=0?'丰三中':school;
  return y+'年'+season+m+'月'+short+'食堂'+coverG+'出库（'+(coverK==='营'?'营养':'非营养')+'）';
}

    }).catch(function(e){alert('读不了这个文件：'+e.message);});
  };
  c6.appendChild(fIn);
  f.appendChild(c6);

  var c5=el('div','card');
  var b4=el('button','btn warn','清空记录，恢复 11 月数据');
  b4.onclick=function(){
    if(!confirm('会清掉手机上录的出入库和改过的菜谱，恢复成 11 月初的样子。确定？'))return;
    S=seed();rebuildItems();save();render();toast('已重置');
  };
  c5.appendChild(b4);
  f.appendChild(c5);
  return f;
}

/* ---------------- 食材档案 ---------------- */
function renderArchive(){
  var f=document.createDocumentFragment();
  var card=el('div','card');
  card.appendChild(el('div','h')).appendChild(el('b','','食材档案'));
  card.appendChild(el('div','muted','分类、单位、单价都在这里改，改完全表跟着变（菜谱、出库、结算都用这份）。'));
  var inp=el('input','');inp.placeholder='搜品名…';inp.style.margin='10px 0 6px';
  card.appendChild(inp);
  var acat='all';
  var az='';
  var letters=[];
  ORDER.forEach(function(n){var L=pyOf(n);if(letters.indexOf(L)<0)letters.push(L);});
  letters.sort();
  var bar=el('div','azbar');
  var azBtns={};
  ['全'].concat(letters).forEach(function(L){
    var b=el('button',L==='全'?'on':'',L);
    b.onclick=function(){az=(L==='全'?'':L);Object.keys(azBtns).forEach(function(k){azBtns[k].className=(k===L)?'on':'';});draw();};
    azBtns[L]=b;bar.appendChild(b);
  });
  card.appendChild(bar);
  var seg=el('div','seg segwrap');
  [['all','全部']].concat(CATS.map(function(c){return [c,c];})).forEach(function(m){
    var b=el('button',m[0]==='all'?'on':'',m[1]);
    b.onclick=function(){acat=m[0];Array.prototype.forEach.call(seg.children,function(x){x.className='';});b.className='on';draw();};
    seg.appendChild(b);
  });
  card.appendChild(seg);
  var list=el('div');card.appendChild(list);
  function draw(){
    clr(list);
    var kw=inp.value.trim();
    CATS.forEach(function(c){
      if(acat!=='all'&&acat!==c)return;
      var names=ORDER.filter(function(n){return catOf(n)===c&&(!kw||n.indexOf(kw)>=0)&&(!az||pyOf(n)===az);});
      if(!names.length)return;
      list.appendChild(el('div','sect',c));
      names.forEach(function(n){
        var it=ITEM[n];
        var row=el('div','row');
        var nm=el('div','nm');
        nm.appendChild(el('b','',n));
        var st=stockOf(n);
        nm.appendChild(el('small','','结存 '+fmt(st)+' '+unitOf(n)+' · 单价 ¥'+fmt(priceOf(n),2)));
        var ops=el('div','ops');
        var cs=el('select','mini-sel');
        CATS.forEach(function(cc){var o=el('option','',cc);o.value=cc;if(cc===it.c)o.selected=true;cs.appendChild(o);});
        cs.onchange=function(){it.c=cs.value;save();draw();};
        var us=el('select','mini-sel');
        ['斤','公斤','桶','袋','瓶','件','包','个','批'].forEach(function(u){var o=el('option','',u);o.value=u;if(u===it.u)o.selected=true;us.appendChild(o);});
        us.onchange=function(){it.u=us.value;save();draw();};
        var ps=el('input','mini-num');ps.type='number';ps.value=fmt(priceOf(n),2);
        ps.onchange=function(){S.price[n]=num(ps.value);save();toast(n+' 单价改为 ¥'+fmt(S.price[n],2));};
        ops.appendChild(cs);ops.appendChild(us);ops.appendChild(ps);
        nm.appendChild(ops);
        row.appendChild(nm);
        list.appendChild(row);
      });
    });
    if(!kw)list.appendChild(el('div','muted','改完自动保存。'));
  }
  inp.oninput=draw;draw();
  var add=el('button','btn ghost','\uff0b 新增品名');
  add.style.marginTop='12px';
  add.onclick=function(){
    var box=buildItemForm();
    card.appendChild(box);
    add.style.display='none';
  };
  card.appendChild(add);
  f.appendChild(card);
  return f;
}


function num2(v){var n=parseFloat(v);return isFinite(n)?n:0;}
function applyImport(wb){
  var pick=function(rows,i,c){var r=rows[i]||[];var v=r[c];return v===undefined?'':v;};
  var outs=[],ins=[],ops=[],ones=[];
  (wb['每日出库']||[]).forEach(function(r,i){
    if(i<3)return;
    var d=serialToDate(r[0]);if(!d)return;
    var n=r[4];if(!n)return;
    if(num2(r[6])<=0)return;
    outs.push({d:d,t:r[2]||'早/晚',n:n,q:num2(r[6]),p:num2(r[7])});
  });
  (wb['本月入库']||[]).forEach(function(r,i){
    if(i<3)return;
    var d=serialToDate(r[0]);if(!d)return;
    var n=r[3];if(!n)return;
    if(num2(r[5])<=0)return;
    ins.push({d:d,no:r[1]||'',n:n,q:num2(r[5]),p:num2(r[6]),sup:r[8]||''});
  });
  (wb['上月结余']||[]).forEach(function(r,i){
    if(i<3)return;
    var n=r[1];if(!n)return;
    ops.push({n:n,q:num2(r[4]),p:num2(r[5])});
  });
  (wb['一次性出库']||[]).forEach(function(r,i){
    if(i<3)return;
    var d=serialToDate(r[0]);if(!d)return;
    var n=r[2];if(!n)return;
    ones.push({d:d,n:n,q:num2(r[4]),p:num2(r[5]),dir:'out',h:1});
  });
  S.outLog=outs;S.inLog=ins;S.oneLog=ones;
  S.opening={};
  ops.forEach(function(o){if(o.q)S.opening[o.n]=o.q;});
  // 新出现的品名自动补进档案
  var seen={};
  ORDER.forEach(function(n){seen[n]=1;});
  outs.concat(ins,ones).forEach(function(o){
    if(seen[o.n])return;seen[o.n]=1;
    S.items.push({n:o.n,c:'蔬菜',u:'斤'});
  });
  rebuildItems();recompute();save();render();
  toast('已导入：出库 '+outs.length+' 行 / 入库 '+ins.length+' 行');
}


/* ---------------- 导出 ---------------- */
function exportSheets(){
  var out=[['日期','星期','餐次','分类','品名','单位','数量','单价(元)','出库金额(元)','领用人','备注']];
  S.outLog.slice().sort(function(a,b){return a.d<b.d?-1:(a.d>b.d?1:0);}).forEach(function(o){
    out.push([o.d,DAYC[wdOf(o.d)],o.t,catOf(o.n),o.n,unitOf(o.n),r2(o.q),o.p,r2(o.q*o.p),'',(S.note||{})[o.d+'|'+o.t]||'']);
  });
  var one=[['日期','分类','品名','单位','数量','单价(元)','金额(元)','用途','领用人','备注']];
  S.oneLog.forEach(function(o){if(o.dir==='in')return;one.push([o.d,catOf(o.n),o.n,unitOf(o.n),r2(o.q),o.p,r2(o.q*o.p),o.use||'','','']);});
  var inb=[['日期','单据号','分类','品名','单位','数量','单价(元)','入库金额(元)','供应商','验收人','备注']];
  S.inLog.slice().sort(function(a,b){return a.d<b.d?-1:1;}).forEach(function(o){
    inb.push([o.d,o.no||'',catOf(o.n),o.n,unitOf(o.n),r2(o.q),o.p,r2(o.q*o.p),o.sup||'','','']);
  });
  var op=[['序号','品名','分类','单位','结余数量','单价(元)','结余金额(元)','备注']];
  ORDER.forEach(function(n,i){
    var q=num(S.opening&&S.opening[n]);
    op.push([i+1,n,catOf(n),unitOf(n),q,priceOf(n),r2(q*priceOf(n)),'']);
  });
  // 月度结算（按类别，和 v1 同列）
  var set=[['类别','原材料名称','本月入库金额','营养午餐','早、晚餐','出库合计','上月余额','本月余额']];
  var T=[0,0,0,0,0];
  CATS.forEach(function(c){
    var ia=0,nu=0,ev=0,ob=0,rows=[];
    ORDER.forEach(function(n){
      if(catOf(n)!==c)return;
      var i2=0,u2=0,e2=0;
      S.inLog.forEach(function(o){if(o.n===n)i2+=o.q*o.p;});
      S.outLog.forEach(function(o){if(o.n===n){if(o.t==='午')u2+=o.q*o.p;else e2+=o.q*o.p;}});
      var ob2=num(S.opening&&S.opening[n])*priceOf(n);
      if(i2||u2||e2||ob2){
        rows.push([n,r2(i2),r2(u2),r2(e2),r2(ob2)]);
        ia+=i2;nu+=u2;ev+=e2;ob+=ob2;
      }
    });
    if(!rows.length)return;
    rows.forEach(function(r){set.push([c,r[0],r[1],r[2],r[3],r2(r[2]+r[3]),r[4],r2(r[4]+r[1]-r[2]-r[3])]);});
    set.push([c+'小计','',r2(ia),r2(nu),r2(ev),r2(nu+ev),r2(ob),r2(ob+ia-nu-ev)]);
    T[0]+=ia;T[1]+=nu;T[2]+=ev;T[3]+=nu+ev;T[4]+=ob;
  });
  set.push(['合计','',r2(T[0]),r2(T[1]),r2(T[2]),r2(T[3]),r2(T[4]),r2(T[4]+T[0]-T[1]-T[2])]);
  var arch=[['序号','品名','分类','单位','备注']];
  ORDER.forEach(function(n,i){arch.push([i+1,n,catOf(n),unitOf(n),'']);});
  return [{name:'每日出库',rows:out},{name:'一次性出库',rows:one},
          {name:'本月入库',rows:inb},{name:'上月结余',rows:op},
          {name:'月度结算',rows:set},{name:'食材档案',rows:arch}];
}
function downloadXlsx(){
  var buf=makeXlsx(exportSheets());
  var blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='食堂出入库结算表_'+(S.month||'')+'.xlsx';
  document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1500);
  toast('已导出 Excel');
}

  else if(qs.indexOf('slip=1')>=0)setTimeout(function(){showSlip('午');},400);

if(typeof module!=='undefined')module.exports={
  seed:seed, exportSheets:exportSheets, dayRows:dayRows, refOf:refOf,
  totals:totals, dedupe:dedupe, recompute:recompute, rebuild:function(){rebuildItems();},
  get S(){return S;}, set S(v){S=v;}, setItems:function(){rebuildItems();}
};
})();
